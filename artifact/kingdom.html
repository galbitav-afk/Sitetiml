      const o = await askJSON(P_.outline(c, fitBytes(digestShort, 150000)));
      const chs = (o.chapters || []).filter((x) => x?.title);
      if (!chs.length) throw new Error("לא התקבל מבנה למחברת. נסה שוב.");
      const out = new Array(chs.length); let done = 0; const queue = chs.map((ch, i) => ({ ch, i }));
      const worker = async () => { for (let it = queue.shift(); it; it = queue.shift()) {
        const nums = (it.ch.lessonNumbers || []).filter((n) => n >= 1 && n <= ready.length);
        const src = (nums.length ? nums : ready.map((_, k) => k + 1)).map((n) => lessonDigest(ready[n - 1], n)).join("\n\n---\n\n");
        const r = await askJSON(P_.chapter(c, it.ch, fitBytes(src, 190000)));
        out[it.i] = { courseId: c.id, n: it.i, title: it.ch.title, lessonNumbers: nums, content: String(r.content || "") };
        done++; setProg({ t: `כותב פרקים… (${done}/${chs.length})`, v: 0.1 + 0.75 * (done / chs.length) });
      } };
      await Promise.all([worker(), worker()]);
      setProg({ t: "מכין דף הכנה למבחן…", v: 0.9 });
      const prep = await askJSON(P_.examPrep(c, fitBytes([`פרקים: ${chs.map((x) => x.title).join(" · ")}`, ...ready.map((l, i) => `שיעור ${i + 1}: ${l.title}\n${l.summary.overview}\nעיקרים: ${(l.summary.takeaways || []).join(" | ")}`), examStyle(store.exams.filter((e) => e.courseId === c.id))].join("\n\n"), 180000)));
      for (const ch of out) await put("chapters", `${c.id}_${ch.n}`, ch);
      for (let i = out.length; i < (nb?.chapterCount || 0); i++) await del("chapters", `${c.id}_${i}`);
      await patch("courses", c.id, { notebook: { title: String(o.title || c.name), introduction: String(o.introduction || ""), examPrep: String(prep.examPrep || ""), glossary: mergeTerms(ready.flatMap((l) => l.summary.keyTerms || [])), chapterCount: out.length, lessonIds: ready.map((l) => l.id), updatedAt: Date.now() } });

    (a) => [a.h("תוכן העניינים", 0), ...[...(nb ? (chapters || []).map((ch, i) => `פרק ${i + 1}: ${ch.title}`).concat(["מילון מושגים", "הכנה למבחן"]) : []), ...(full || !nb ? ready.map((l, i) => `שיעור ${i + 1}: ${l.title}`) : []), ...(full ? ["נספח: שאלות תרגול ומפתח תשובות"] : [])].map((t) => a.para([a.run(t)], { spacing: { after: 60 }, indent: { start: 240 } })), a.pageBreak()],
    ...(nb ? [(a) => [...a.blocks(nb.introduction, 1), ...(chapters || []).flatMap((ch, i) => [a.pageBreak(), a.h(`פרק ${i + 1}: ${ch.title}`, 0), ...(ch.lessonNumbers?.length ? [a.para([a.run(`מתוך שיעורים ${ch.lessonNumbers.join(", ")}`, { color: a.MUTED, size: 20 })])] : []), ...a.blocks(ch.content, 1)]),
      ...(nb.glossary?.length ? [a.pageBreak(), a.h("מילון מושגים", 0), a.termsTable(nb.glossary)] : []), a.pageBreak(), a.h("הכנה למבחן", 0), ...a.blocks(nb.examPrep, 1)]] : []),
    ...((full || !nb) ? ready.map((l, i) => (a) => [a.pageBreak(), ...lessonSection(l, i + 1)(a)]) : []),

  return html`<div class="grid2" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));align-items:start">

        <div class="stack" style="gap:4px;max-height:200px;overflow-y:auto">${ready.map((l, i) => html`<label class="row small" style="gap:8px;cursor:pointer"><input type="checkbox" checked=${chosen.has(l.id)} onChange=${(e) => { const n = new Set(chosen); e.target.checked ? n.add(l.id) : n.delete(l.id); setSel(n); }} /><span class="truncate">${i + 1}. ${l.title}</span></label>`)}</div></div>

/* ---------------- Chat ---------------- */
function Chat({ storageKey, scope, build, suggestions, disabled }) {
  const [msgs, setMsgs] = useState(() => { try { return JSON.parse(sessionStorage.getItem(storageKey) || "[]"); } catch { return []; } });
  const [input, setInput] = useState(""); const [busy, setBusy] = useState(false); const ctx = useRef(null); const ac = useRef(null); const end = useRef();
  useEffect(() => { try { sessionStorage.setItem(storageKey, JSON.stringify(msgs.slice(-30))); } catch {} end.current?.scrollIntoView({ block: "end", behavior: "smooth" }); }, [msgs]);
  async function send(q) {
    q = q.trim(); if (!q || busy) return; setInput("");
    const history = [...msgs, { role: "user", content: q }]; setMsgs([...history, { role: "assistant", content: "" }]); setBusy(true); ac.current = new AbortController();
    try {
      ctx.current ??= await build();
      const turns = history.slice(-12).map((m) => ({ ...m }));
      turns[0] = { role: "user", content: P_.chatSystem(scope, ctx.current) + "\n\nשאלת הסטודנט: " + turns[0].content };
      if (turns[0].role !== "user") turns.shift();
      const text = await askText(turns, { onText: (t) => setMsgs([...history, { role: "assistant", content: t }]), signal: ac.current.signal });
      setMsgs([...history, { role: "assistant", content: text || "(אין תשובה)" }]);
    } catch (e) { setMsgs([...history, { role: "assistant", content: "⚠️ " + e.message }]); } finally { setBusy(false); }
  }
  if (disabled) return html`<${Empty} icon="chat" title="הצ׳אט יתעורר אחרי השיעור המסוכם הראשון" />`;
  return html`<div class="card chat"><div class="chat-log">
      ${!msgs.length && html`<div class="empty" style="padding:20px"><div class="glyph"><${Icon} n="chat" s=${24} /></div><p class="muted" style="max-width:440px">שאל כל שאלה על ${scope}. התשובות מבוססות על החומר שלך.</p><div class="row" style="justify-content:center">${suggestions.map((s) => html`<button class="btn ghost sm" onClick=${() => send(s)}>${s}</button>`)}</div></div>`}
      ${msgs.map((m) => html`<div class=${"bubble " + (m.role === "user" ? "me" : "ai")}>${m.role === "assistant" ? (m.content ? html`<${Md} text=${m.content} />` : html`<${Busy} label="חושב…" />`) : html`<p style="white-space:pre-wrap">${m.content}</p>`}</div>`)}
      <div ref=${end}></div></div>
    <form onSubmit=${(e) => { e.preventDefault(); send(input); }}><input class="input" placeholder="שאל כל דבר על החומר…" value=${input} onInput=${(e) => setInput(e.target.value)} aria-label="שאלה" />
      ${busy ? html`<button type="button" class="btn ghost" onClick=${() => ac.current?.abort()}>עצור</button>` : html`<button class="btn primary" disabled=${!input.trim()}>שלח</button>`}
      ${msgs.length > 0 && !busy && html`<button type="button" class="btn quiet" onClick=${() => { setMsgs([]); ctx.current = null; }} aria-label="שיחה חדשה"><${Icon} n="trash" /></button>`}</form></div>`;
}

function PlanTab({ c, lessons, cards, attempts, exams }) {
  const [date, setDate] = useState(c.examDate || ""); const [hours, setHours] = useState(2); const [busy, setBusy] = useState(false);
  const plan = c.plan; const done = new Set(c.planDone || []); const today = todayISO();
  async function gen() {
    if (!date) return pushToast("בחר תאריך מבחן", "bad"); if (date < today) return pushToast("תאריך המבחן כבר עבר", "bad");
    setBusy(true);
    try {
      const ls = fitBytes((await withSections(lessons.filter((l) => l.summary))).map((l, i) => lessonDigest(l, i + 1, false)).join("\n\n") || "(עוד אין שיעורים מסוכמים)", 120000) + (examStyle(exams) ? "\n\nניתוח מבחנים קודמים:\n" + examStyle(exams) : "");
      const r = await askJSON(P_.plan(c, today, date, hours, ls, weakTopics(topicStats(attempts.filter((a) => a.kind !== "open"))), cards.filter(isDue).length));
      const days = (r.days || []).filter((d) => d?.date).map((d) => ({ date: String(d.date), focus: String(d.focus || ""), tasks: (d.tasks || []).map((t, i) => ({ id: `${d.date}-${i}`, title: String(t.title || ""), detail: String(t.detail || ""), kind: String(t.kind || "review") })) }));
      await patch("courses", c.id, { examDate: date, plan: { days, tips: (r.tips || []).map(String), at: Date.now() }, planDone: [] });
      pushToast("תוכנית הלימוד מוכנה", "good");
    } catch (e) { pushToast(e.message, "bad"); } finally { setBusy(false); }
  }
  const toggle = (id) => { const n = new Set(done); n.has(id) ? n.delete(id) : n.add(id); patch("courses", c.id, { planDone: [...n] }).catch(() => pushToast("השמירה נכשלה", "bad")); };
  const total = (plan?.days || []).reduce((s, d) => s + d.tasks.length, 0);

  return html`<div class="stack">
    <div class="card stack"><h2>תוכנית לימוד עד המבחן</h2>
      <div class="grid3" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr));align-items:end">
        <div><label class="lbl" for="pl-d">תאריך המבחן</label><input id="pl-d" type="date" class="input" min=${today} value=${date} onInput=${(e) => setDate(e.target.value)} /></div>
        <div><label class="lbl" for="pl-h">שעות ביום</label><select id="pl-h" class="select" value=${hours} onChange=${(e) => setHours(+e.target.value)}>${[0.5, 1, 1.5, 2, 3, 4, 5, 6].map((h) => html`<option value=${h}>${h}</option>`)}</select></div>
        <button class="btn primary" disabled=${busy || !date} onClick=${gen}>${busy ? html`<${Busy} label="בונה…" />` : html`<${Icon} n="cal" />${plan ? "בנה מחדש" : "בנה לי תוכנית"}`}</button>
      </div><p class="hint">התוכנית מתחשבת בנושאים, בנושאים החלשים לפי המבחנים, בכרטיסיות שממתינות ובמבחנים הקודמים.</p></div>
    ${plan ? html`
      <div class="card row"><div class="grow"><${Bar} v=${total ? done.size / total : 0} /></div><span class="small muted">${done.size}/${total} משימות</span></div>
      ${plan.tips?.length > 0 && html`<div class="notice small">${plan.tips.map((t) => html`<p>${t}</p>`)}</div>`}
      ${plan.days.map((d) => { const isT = d.date === today; return html`<div class="card stack" style=${{ gap: "8px", opacity: d.date < today ? 0.7 : 1, borderColor: isT ? "var(--plum)" : undefined, borderWidth: isT ? "2px" : undefined }}>
        <div class="row between"><b>${new Date(d.date + "T00:00:00").toLocaleDateString("he-IL", { weekday: "long", day: "numeric", month: "short" })}${isT ? html` <span class="chip">היום</span>` : ""}</b><span class="small muted">${d.focus}</span></div>
        ${d.tasks.map((t) => html`<label class="row" style="gap:10px;align-items:start;cursor:pointer"><input type="checkbox" style="margin-top:6px" checked=${done.has(t.id)} onChange=${() => toggle(t.id)} /><span style=${{ textDecoration: done.has(t.id) ? "line-through" : "none", color: done.has(t.id) ? "var(--muted)" : "inherit" }}><span class="chip" style="margin-inline-end:6px">${KIND[t.kind] || t.kind}</span><b>${t.title}</b>${t.detail && html`<span class="small muted" style="display:block">${t.detail}</span>`}</span></label>`)}</div>`; })}`

/* ---------------- Search ---------------- */
function SearchView({ store }) {
  const [q, setQ] = useState(""); const [deep, setDeep] = useState(null); const [busy, setBusy] = useState(false);
  const term = q.trim(); const low = term.toLowerCase();
  const hits = term.length < 2 ? [] : store.lessons.flatMap((l) => {
    const out = []; const s = l.summary;
    if (l.title.toLowerCase().includes(low)) out.push({ l, where: "שם השיעור", text: l.title });
    for (const sec of s?.sections || []) if ((sec.heading + " " + sec.content).toLowerCase().includes(low)) out.push({ l, where: "סיכום: " + sec.heading, text: snippet(sec.content, term) });
    for (const k of s?.keyTerms || []) if ((k.term + k.definition).toLowerCase().includes(low)) out.push({ l, where: "מושג", text: `${k.term}: ${k.definition}` });
    return out;
  });
  async function searchTranscripts() {
    setBusy(true); const out = [];
    try { for (const l of store.lessons) { const t = await loadText("transcripts", l.id, l.textParts); let i = t.toLowerCase().indexOf(low), n = 0; while (i >= 0 && n < 3) { out.push({ l, where: "תמלול", text: snippet(t.slice(Math.max(0, i - 120), i + 200), term) }); i = t.toLowerCase().indexOf(low, i + term.length); n++; } } setDeep(out); }
    finally { setBusy(false); }
  }
  const all = [...hits, ...(deep || [])]; const groups = new Map(); for (const h of all) groups.set(h.l.id, [...(groups.get(h.l.id) || []), h]);
  return html`<section class="stack"><h1>חיפוש</h1><input class="input" style="min-height:52px;font-size:1.1rem" placeholder="מושג, נושא, או משפט מהשיעור…" value=${q} onInput=${(e) => { setQ(e.target.value); setDeep(null); }} autofocus aria-label="חיפוש" />
    ${term.length >= 2 && html`<div class="row"><button class="btn ghost sm" disabled=${busy} onClick=${searchTranscripts}>${busy ? html`<${Busy} label="מחפש בתמלולים…" />` : "חפש גם בתמלולים המלאים"}</button><span class="small muted">${all.length} תוצאות</span></div>`}
    ${term.length < 2 ? html`<p class="muted">החיפוש עובר על כל הסיכומים והמושגים בכל הקורסים.</p>` : !all.length ? html`<p class="muted">לא נמצאו תוצאות.</p>` : [...groups].map(([id, list]) => { const l = list[0].l; const c = store.courses.find((x) => x.id === l.courseId); return html`<div class="card stack" style="gap:6px"><a href=${"#l-" + id}><b>${l.title}</b></a><span class="tiny muted">${c?.name || ""}</span>${list.slice(0, 4).map((h) => html`<div class="small"><span class="chip" style="margin-inline-end:6px">${h.where}</span>${highlight(h.text, term)}</div>`)}</div>`; })}
  </section>`;
}
function snippet(t, q, r = 110) { const i = t.toLowerCase().indexOf(q.toLowerCase()); if (i < 0) return t.slice(0, r * 2); const s = Math.max(0, i - r), e = Math.min(t.length, i + q.length + r); return (s ? "…" : "") + t.slice(s, e) + (e < t.length ? "…" : ""); }

/* ---------------- Preferences ---------------- */
function PrefsView({ store }) {
  const [driveState, setDriveState] = useState(""); const [busy, setBusy] = useState("");
  async function testDrive() { setBusy("test"); try { await drive("list_recent_files", { pageSize: 1, excludeContentSnippets: true }); setDriveState("ok"); } catch (e) { setDriveState(e.message); } finally { setBusy(""); } }
  async function backup() {
    setBusy("backup");
    try {
      const transcripts = {}; for (const l of store.lessons) transcripts[l.id] = await loadText("transcripts", l.id, l.textParts);
      const data = { exportedAt: new Date().toISOString(), courses: store.courses, lessons: store.lessons, transcripts, cards: store.cards, attempts: store.attempts, exams: store.exams };
      if (await saveFile(`הממלכה של גל - גיבוי ${todayISO()}.json`, JSON.stringify(data))) pushToast("הגיבוי נשמר", "good");
    } catch (e) { pushToast(e.message, "bad"); } finally { setBusy(""); }
  }
  return html`<section class="stack"><h1>הגדרות</h1></section>
    <div class="card stack"><h2>החשבון</h2><p class="muted">מחובר כ-<b>${caps.name || "משתמש Claude"}</b>. הקורסים והסיכומים שלך שמורים בתוך Claude, פרטיים רק לך, וזמינים מכל מכשיר שבו תפתח את הדף.</p></div>
    <div class="card stack"><h2>Google Drive</h2><p class="muted">משמש לייבוא תמלולים ומבחנים קודמים, ולשמירת קובצי Word בתיקייה "הממלכה של גל". החיבור נעשה דרך חשבון ה-Claude שלך (Settings, ואז Connectors, ואז Google Drive).</p>
      <div class="row"><button class="btn ghost" disabled=${!!busy} onClick=${testDrive}>${busy === "test" ? html`<${Busy} label="בודק…" />` : "בדיקת החיבור"}</button>${driveState === "ok" ? html`<span class="chip good">מחובר</span>` : driveState && html`<span class="small" style="color:var(--bad)">${driveState}</span>`}</div>
      ${store.settings?.driveFolderId && html`<p class="small muted">התיקייה בדרייב כבר נוצרה.</p>`}</div>
    <div class="card stack"><h2>גיבוי</h2><p class="muted">הורדת קובץ עם כל הקורסים, הסיכומים, התמלולים והתרגולים, למקרה הצורך.</p><button class="btn ghost" style="justify-self:start" disabled=${!!busy} onClick=${backup}>${busy === "backup" ? html`<${Busy} label="מכין…" />` : "הורדת גיבוי מלא"}</button></div>
    <div class="card stack"><h2>שימוש ועלות</h2><p class="muted">הסיכומים, המבחנים והצ׳אט משתמשים במכסת ה-Claude הרגילה של החשבון שלך, בלי תשלום נוסף. סיכום של שיעור ארוך מאוד משתמש בכמה בקשות. אם תגיע למגבלה, האתר יגיד לך ותוכל להמשיך מאותה נקודה אחר כך.</p></div>`;
}

/* ---------------- Help ---------------- */
function HelpView() {
  return html`<section class="stack"><h1>מדריך</h1><p class="muted">איך להפיק את המקסימום מהממלכה.</p></section>
    <div class="card stack"><h2>הקלטת שיעור עם תמלול חי</h2>
      <ol class="steps">
        <li><span>לוחצים <a href="#rec">הקלטה</a> (בתפריט, או בדף של הקורס), בוחרים קורס ושם לשיעור, ולוחצים <b>התחלת הקלטה</b>.</span></li>
        <li><span>נפתח חלון קטן של המקליט. בפעם הראשונה הדפדפן מבקש אישור למיקרופון: מאשרים. משאירים את החלון פתוח לצד הדף (לא ממזערים).</span></li>
        <li><span>התמלול מופיע בדף ההקלטה בזמן אמת. משם אפשר להשהות בהפסקה, לסמן ⭐ רגע חשוב ולהוסיף פתקים. אין הגבלת זמן, והתמלול מגובה לענן כל כמה דקות.</span></li>
        <li><span>בסוף לוחצים <b>סיום השיעור</b>, מאשרים את הקורס, ו-Claude מסכם: סיכום, מבחן, כרטיסיות ושאלות פתוחות.</span></li>
      </ol>
      <p class="muted small">למה חלון נפרד? Claude לא מאפשר לדפים שלו להשתמש במיקרופון, אז המקליט רץ לידו ושולח לכאן את התמלול. התמלול עצמו נעשה בחינם על ידי הדפדפן (Chrome או Edge במחשב), וצריך חיבור לאינטרנט.</p>
      <h3>אם החלון לא נפתח או שהמיקרופון חסום בו</h3>
      <p class="muted">בדף ההקלטה לוחצים <b>הורדת המקליט למחשב</b> ופותחים את הקובץ ב-Chrome. מקליטים שם, ובסוף לוחצים <b>העתק לממלכה</b>, חוזרים לכאן ולוחצים <span class="kbd">Ctrl+V</span> בכל מקום באתר: הממלכה מזהה את התמלול ומציעה לשמור אותו בקורס.</p>
      <h3>דרכים נוספות</h3>
      <ul style="margin:0;padding-inline-start:1.2em" class="muted">
        <li><b>הקלדה קולית בגוגל דוקס</b> (כלים, ואז הקלדה קולית): בסוף השיעור, שיעור חדש, ואז מגוגל דרייב.</li>
        <li><b>Live Transcribe</b> באנדרואיד: מעתיקים את הטקסט ומדביקים כאן.</li>
        <li><b>זום, טימס ויוטיוב:</b> מורידים את התמלול האוטומטי (VTT או Word) ומעלים אותו כאן.</li>
      </ul>
    </div>
    <div class="card stack"><h2>מה קורה כשלוחצים "סכם"</h2><p class="muted">Claude קורא את התמלול בחלקים (כחצי שעה דיבור בכל חלק), מסכם כל חלק לפי נושאים, ואז בונה סיכום מאוחד, מבחן אמריקאי, כרטיסיות ושאלות פתוחות. בשיעור של 3 שעות זה לוקח כמה דקות. אם משהו נעצר באמצע, "נסה שוב" ממשיך מאותה נקודה.</p></div>
    <div class="card stack"><h2>מבחנים קודמים</h2><p class="muted">בלשונית "מבחנים קודמים" בכל קורס מעלים מבחן (PDF, גם סרוק, Word או צילום). Claude מנתח את המבנה והנושאים, כותב פתרון מודרך, והסימולציות בונות שאלות באותו סגנון.</p></div>
    <div class="card stack"><h2>שיתוף עם בת הזוג</h2>
      <ol class="steps">
        <li><span>בכפתור <b>Share</b> של הדף ב-Claude, הזמן אותה לפי המייל בתור <b>עורכת</b> (Editor). בלי הרשאת עריכה היא לא תוכל לשמור.</span></li>
        <li><span>היא פותחת את הקישור בחשבון ה-Claude שלה. הקורסים שלה פרטיים לה, ושלך פרטיים לך: אף אחד לא רואה את הנתונים של השני.</span></li>
        <li><span>הסיכומים שלה משתמשים במכסת ה-Claude שלה, וחיבור הדרייב שלה הוא שלה.</span></li>
      </ol></div>
    <div class="card stack"><h2>טיפים ללמידה</h2><ul style="margin:0;padding-inline-start:1.2em" class="muted">
      <li>חזרה יומית קצרה על הכרטיסיות עדיפה על שעה פעם בשבוע.</li><li>שאלות פתוחות עם בדיקה מכינות למבחן הרבה יותר מקריאה חוזרת.</li><li>התחל מהמבחנים הקודמים: הם מראים מה המרצה באמת שואל.</li><li>אפשר לערוך כל נושא בסיכום (כפתור "עריכה") ולהוסיף הערות משלך.</li></ul></div>`;
}

/** Keep text under a UTF-8 byte budget (Claude input per call is capped at 256KB). */
function fitBytes(text, max) {
  if (bytes(text) <= max) return text;
  let lo = 0, hi = text.length;
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (bytes(text.slice(0, mid)) <= max) lo = mid; else hi = mid - 1; }
  return text.slice(0, lo) + "\n\n[…החומר קוצר בגלל אורכו…]";
}

/** Split long transcripts into parts of ~maxBytes, on paragraph/sentence boundaries. */
function splitByBytes(text, maxBytes) {
  const units = text.replace(/\r/g, "").split(/(?<=\n\n)|(?<=[.!?…])\s+/);
  const parts = []; let cur = "";
  for (const u of units) {
    if (bytes(cur) + bytes(u) > maxBytes && cur) { parts.push(cur.trim()); cur = ""; }
    if (bytes(u) > maxBytes) { // a giant run-on chunk: hard-cut it
      let rest = u;
      while (bytes(rest) > maxBytes) { const piece = fitBytes(rest, maxBytes).replace(/\n\n\[…החומר קוצר בגלל אורכו…\]$/, ""); parts.push(piece); rest = rest.slice(piece.length); }
      cur = rest;
    } else cur += (cur ? " " : "") + u;
  }
  if (cur.trim()) parts.push(cur.trim());
  return parts;
}

function loadScript(src) {
  return new Promise((res, rej) => {

/* ---------- Markdown + math (KaTeX → native MathML, no fonts needed) ---------- */
function mdToHtml(md) {
  if (!md) return "";

    .replace(/(^|[^\\\d$])\$([^\s$][^$\n]*?[^\s$]|[^\s$])\$(?!\d)/g, (_, pre, t) => { maths.push([t, false]); return `${pre}MATHX${maths.length - 1}X`; });

async function bootCaps() {

  const got = await Promise.all(names.map((n) => window.claude.use(n).catch(() => null)));
  [caps.db, caps.user, caps.sample, caps.mcp, caps.downloads, caps.perms] = got;

function resultText(r) {
  const p = r?.payload;
  if (typeof p === "string") return p;
  if (p && typeof p === "object") for (const k of ["content", "text", "fileContent", "body"]) if (typeof p[k] === "string") return p[k];
  const blocks = (r?.content || []).filter((b) => b.type === "text").map((b) => b.text);
  if (blocks.length) return blocks.join("\n");
  return p ? JSON.stringify(p) : "";
}

/* =====================================================================
   Data store (per-user private subtree: data/users/<id>/…)
   ===================================================================== */
const COLLS = ["courses", "lessons", "cards", "attempts", "exams"];
const root = () => caps.db.doc(`data/users/${caps.uid}/root`);
const col = (n) => root().collection(n);
const put = (n, id, data) => col(n).doc(id).set(data);
const patch = (n, id, data) => col(n).doc(id).update(data);
const del = (n, id) => col(n).doc(id).delete();

function useStore(ready) {
  const [s, set] = useState({ loaded: false, courses: [], lessons: [], cards: [], attempts: [], exams: [], settings: {}, slow: false });
  useEffect(() => {
    if (!ready) return;
    const seen = new Set();
    const timer = setTimeout(() => set((x) => ({ ...x, slow: true })), 10000);
    const unsubs = COLLS.map((n) => col(n).onSnapshot(
      (snap) => {
        seen.add(n);
        const rows = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
        set((x) => ({ ...x, [n]: rows, loaded: seen.size >= COLLS.length, slow: seen.size >= COLLS.length ? false : x.slow }));
        if (seen.size >= COLLS.length) clearTimeout(timer);
      },
      (e) => set((x) => ({ ...x, error: e?.message || e?.code })),
    ));
    unsubs.push(col("settings").doc("main").onSnapshot((d) => set((x) => ({ ...x, settings: d.exists ? d.data() : {} }))));
    return () => { clearTimeout(timer); unsubs.forEach((u) => u()); };
  }, [ready]);
  return s;
}

/* Large text (transcripts, past exams) is stored in ≤100KB pieces. */
async function saveText(coll, ownerId, text) {
  const parts = splitByBytes(text, 100000);
  for (let i = 0; i < parts.length; i++) await put(coll, `${ownerId}_${i}`, { ownerId, n: i, text: parts[i] });
  for (let i = parts.length; i < parts.length + 20; i++) {
    const ref = col(coll).doc(`${ownerId}_${i}`); const snap = await ref.get(); if (!snap.exists) break; await ref.delete();
  }
  return parts.length;
}
async function loadText(coll, ownerId, n) {
  const out = [];
  for (let i = 0; i < (n || 50); i++) { const s = await col(coll).doc(`${ownerId}_${i}`).get(); if (!s.exists) break; out.push(s.data().text); }
  return out.join("\n\n");
}
/* Exact-byte storage for strings that must round-trip unchanged (JSON). */
async function saveRaw(coll, ownerId, str) {
  const parts = []; let i = 0;
  while (i < str.length) { let j = Math.min(str.length, i + 45000); while (j > i + 1 && bytes(str.slice(i, j)) > 100000) j = i + Math.floor((j - i) * 0.8); parts.push(str.slice(i, j)); i = j; }
  for (let k = 0; k < parts.length; k++) await put(coll, `${ownerId}_${k}`, { ownerId, n: k, text: parts[k] });
  for (let k = parts.length; k < parts.length + 20; k++) { const ref = col(coll).doc(`${ownerId}_${k}`); const sn = await ref.get(); if (!sn.exists) break; await ref.delete(); }
  return parts.length;
}
async function loadRaw(coll, ownerId, n) {
  const out = []; for (let k = 0; k < n; k++) { const sn = await col(coll).doc(`${ownerId}_${k}`).get(); if (!sn.exists) break; out.push(sn.data().text); }
  return out.join("");
}
async function deleteText(coll, ownerId) {
  for (let i = 0; i < 60; i++) { const ref = col(coll).doc(`${ownerId}_${i}`); const s = await ref.get(); if (!s.exists) break; await ref.delete(); }
}

const BOX_DAYS = [0, 1, 3, 7, 14, 30];
const reviewCard = (c, knew) => { const box = knew ? Math.min(5, (c.box || 1) + 1) : 1; return { box, due: Date.now() + (knew ? BOX_DAYS[box] * 864e5 : 10 * 6e4) }; };
const isDue = (c) => (c.due || 0) <= Date.now();
function cleanQuestions(qs) {
  if (!Array.isArray(qs)) return [];
  return qs.filter((q) => q && typeof q.question === "string" && Array.isArray(q.options) && q.options.length >= 2 && Number.isInteger(q.correctIndex) && q.correctIndex >= 0 && q.correctIndex < q.options.length)
    .map((q) => ({ question: q.question, options: q.options.map(String), correctIndex: q.correctIndex, explanation: String(q.explanation || ""), topic: String(q.topic || "כללי").trim(), lessonTitle: q.lessonTitle || "" }));
}
function cleanOpen(qs) {
  if (!Array.isArray(qs)) return [];
  return qs.filter((q) => q && typeof q.question === "string").map((q) => ({ question: q.question, modelAnswer: String(q.modelAnswer || ""), rubric: Array.isArray(q.rubric) ? q.rubric.map(String) : [], topic: String(q.topic || "") }));
}
const shuffleQ = (q) => { const o = q.options.map((_, i) => i).sort(() => Math.random() - 0.5); return { ...q, options: o.map((i) => q.options[i]), correctIndex: o.indexOf(q.correctIndex) }; };
const scoreOf = (qs, ans) => (qs.length ? Math.round((qs.filter((q, i) => ans[i] === q.correctIndex).length / qs.length) * 100) : 0);
function topicStats(attempts) {
  const m = new Map();
  for (const a of attempts) (a.questions || []).forEach((q, i) => { const t = q.topic || "כללי"; const s = m.get(t) || { c: 0, n: 0 }; s.n++; if (a.answers?.[i] === q.correctIndex) s.c++; m.set(t, s); });
  return [...m].map(([topic, s]) => ({ topic, c: s.c, n: s.n, pct: Math.round((s.c / s.n) * 100) })).sort((a, b) => a.pct - b.pct);
}
const weakTopics = (stats) => stats.filter((s) => s.n >= 2 && s.pct < 70).map((s) => s.topic);
function mistakes(attempts, max = 20) {
  const seen = new Set(), out = [];
  for (const a of [...attempts].sort((x, y) => y.createdAt - x.createdAt)) (a.questions || []).forEach((q, i) => { if (a.kind !== "open" && a.answers?.[i] !== q.correctIndex && !seen.has(q.question)) { seen.add(q.question); out.push(q); } });
  return out.slice(0, max);
}
function mergeTerms(terms) {
  const m = new Map();
  for (const t of terms || []) { const k = (t.term || "").trim().replace(/["'״׳]/g, "").toLowerCase(); if (!k) continue; const p = m.get(k); if (!p || (t.definition || "").length > (p.definition || "").length) m.set(k, { term: t.term.trim(), definition: (t.definition || "").trim() }); }
  return [...m.values()].sort((a, b) => a.term.localeCompare(b.term, "he"));
}

/* ---------- External sections (very long lessons) ---------- */
const sectionCache = new Map();
async function loadSections(l) {
  if (!l.summary?.sectionChunks) return l.summary?.sections || [];
  const key = l.id + ":" + (l.processedAt || 0);
  if (!sectionCache.has(key)) sectionCache.set(key, loadRaw("sections", l.id, l.summary.sectionChunks).then((t) => { try { return JSON.parse(t); } catch { return []; } }));
  return sectionCache.get(key);
}
async function withSections(ls) {
  return Promise.all(ls.map(async (l) => (l.summary?.sectionChunks ? { ...l, summary: { ...l.summary, sections: await loadSections(l) } } : l)));
}
function useFull(l) {
  const [full, setFull] = useState(l.summary?.sectionChunks ? null : l);
  useEffect(() => { if (!l.summary?.sectionChunks) { setFull(l); return; } let on = true; withSections([l]).then(([x]) => on && setFull(x)); return () => { on = false; }; }, [l]);
  return full;
}

/* ---------- Lesson digests for context ---------- */
function lessonDigest(l, n, full = true) {
  const s = l.summary; if (!s) return "";
  const out = [`# שיעור ${n}: ${l.title}`, s.overview || ""];
  if (full) {
    for (const sec of s.sections || []) out.push(`## ${sec.heading}\n${sec.content}`);
    if (s.keyTerms?.length) out.push("מושגים: " + s.keyTerms.map((k) => `${k.term}: ${k.definition}`).join(" | "));
    if (s.takeaways?.length) out.push("עיקרים: " + s.takeaways.join(" | "));
  } else out.push("נושאים: " + (s.sections || []).map((x) => x.heading).join(" · "));
  return out.join("\n\n");
}
function courseDigest(lessons, maxBytes = 180000) {
  const sorted = [...lessons].filter((l) => l.summary).sort((a, b) => a.createdAt - b.createdAt);
  const full = sorted.map((l, i) => lessonDigest(l, i + 1, true)).join("\n\n---\n\n");
  if (bytes(full) <= maxBytes) return full;
  // Too big: short form for every lesson, then full text for as many recent lessons as fit.
  const short = sorted.map((l, i) => lessonDigest(l, i + 1, false));
  let text = short.join("\n\n");
  for (let i = sorted.length - 1; i >= 0; i--) {
    const candidate = text + "\n\n---\n\n" + lessonDigest(sorted[i], i + 1, true);
    if (bytes(candidate) > maxBytes) break; text = candidate;
  }
  return fitBytes(text, maxBytes);
}
function materialFromParts(parts) {
  return parts.map((p) => [
    ...(p.sections || []).map((s) => `## ${s.heading}\n${s.content}`),
    p.keyTerms?.length ? "מושגים: " + p.keyTerms.map((k) => `${k.term}: ${k.definition}`).join(" | ") : "",
    p.takeaways?.length ? "עיקרים: " + p.takeaways.join(" | ") : "",
    p.openQuestions?.length ? "משימות/פתוח: " + p.openQuestions.join(" | ") : "",
  ].filter(Boolean).join("\n\n")).join("\n\n");
}
function examStyle(exams) {
  const withA = exams.filter((e) => e.analysis);
  if (!withA.length) return "";
  return fitBytes(withA.map((e) => `מבחן "${e.title}": ${e.analysis.summary}\nמבנה: ${e.analysis.structure}\nסוגי שאלות: ${(e.analysis.questionTypes || []).join(", ")}\nנושאים: ${(e.analysis.topics || []).map((t) => `${t.topic} (${t.weight})`).join(", ")}`).join("\n\n"), 20000);
}

/* =====================================================================
   Lesson processing: transcript → part summaries → summary + practice
   ===================================================================== */
const PART_BYTES = 60000;
const running = new Set();

async function processLesson(lesson, course, onToast) {
  if (running.has(lesson.id)) return;
  running.add(lesson.id);
  try {
    const text = await loadText("transcripts", lesson.id, lesson.textParts);
    if (!text.trim()) throw new Error("אין תמלול לשיעור הזה.");
    const parts = splitByBytes(text, PART_BYTES);
    const done = Array.isArray(lesson.partResults) ? [...lesson.partResults] : [];
    for (let i = done.length; i < parts.length; i++) {
      await patch("lessons", lesson.id, { status: "processing", progress: `מסכם חלק ${i + 1} מתוך ${parts.length}`, error: null });
      const prev = done[i - 1]?.sections?.map((s) => s.heading);
      const r = await askJSON(P_.part(course, lesson, i, parts.length, parts[i], prev));
      done.push({
        sections: (r?.sections || []).filter((s) => s?.heading).map((s) => ({ heading: String(s.heading), content: String(s.content || "") })),
        keyTerms: (r?.keyTerms || []).filter((k) => k?.term), takeaways: (r?.takeaways || []).map(String), openQuestions: (r?.openQuestions || []).map(String),
      });
      await patch("lessons", lesson.id, { partResults: done });
    }
    const sections = done.flatMap((p) => p.sections);
    if (!sections.length) throw new Error("לא נמצא תוכן לימודי בתמלול.");
    await patch("lessons", lesson.id, { progress: "מאחד את הסיכום ובונה מבחן, כרטיסיות ושאלות פתוחות…" });
    const material = fitBytes(materialFromParts(done), 190000);
    const mins = speechMinutes(text.length);
    const [meta, quiz] = await Promise.allSettled([
      askJSON(P_.meta(course, lesson, material)),
      askJSON(P_.quiz(course, lesson, material, clamp(Math.round(mins / 9), 8, 20))),
    ]);
    if (meta.status === "rejected") throw meta.reason;
    const [cards, open] = await Promise.allSettled([
      askJSON(P_.cards(course, lesson, material, clamp(Math.round(mins / 5), 10, 30)), { tier: "quick" }),
      askJSON(P_.open(course, lesson.title, material, clamp(Math.round(mins / 30), 3, 6))),
    ]);
    const m = meta.value || {};
    const summary = {
      overview: String(m.overview || ""), sections,
      keyTerms: mergeTerms(m.keyTerms?.length ? m.keyTerms : done.flatMap((p) => p.keyTerms)),
      takeaways: (m.takeaways || done.flatMap((p) => p.takeaways)).map(String),
      openQuestions: (m.openQuestions || []).map(String),
    };
    if (cards.status === "fulfilled") {
      const old = await col("cards").where("lessonId", "==", lesson.id).get();
      for (const d of old.docs) await del("cards", d.id);
      for (const c of (cards.value?.cards || []).filter((c) => c?.front && c?.back))
        await put("cards", newId(), { courseId: course.id, lessonId: lesson.id, front: String(c.front), back: String(c.back), box: 1, due: Date.now(), createdAt: Date.now() });
    }
    let sectionChunks = 0;
    const est = bytes(JSON.stringify({ summary, q: quiz.value, o: open.value }));
    if (est > 200000) { sectionChunks = await saveRaw("sections", lesson.id, JSON.stringify(summary.sections)); summary.sections = []; summary.sectionChunks = sectionChunks; }
    await patch("lessons", lesson.id, {
      status: "ready", progress: null, error: null, summary, partResults: null,
      title: lesson.titleEdited ? lesson.title : (m.title || lesson.title),
      quiz: quiz.status === "fulfilled" ? cleanQuestions(quiz.value?.questions) : lesson.quiz || [],
      openQs: open.status === "fulfilled" ? cleanOpen(open.value?.questions) : lesson.openQs || [],
      minutes: mins, processedAt: Date.now(),
    });
    onToast?.("השיעור סוכם, ונוצרו מבחן, כרטיסיות ושאלות פתוחות", "good");
  } catch (e) {
    await patch("lessons", lesson.id, { status: "error", progress: null, error: e.message || String(e) }).catch(() => {});
    onToast?.(e.message || String(e), "bad");
  } finally { running.delete(lesson.id); }
}

/* =====================================================================
   File reading: txt / md / vtt / srt / docx / pdf / images
   ===================================================================== */
function cleanSubtitles(t) {
  return t.replace(/^WEBVTT.*$/m, "").replace(/^\d+\s*$/gm, "").replace(/^\d\d:\d\d[:.,\d]*\s*-->.*$/gm, "").replace(/<[^>]+>/g, "").replace(/\n{2,}/g, "\n").trim();
}
async function readAsText(file) { return await file.text(); }
async function docxText(file) {
  await loadScript(LIBS.mammoth);
  const r = await window.mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() });
  return r.value;
}
async function pdfDoc(file) {
  await loadScript(LIBS.pdf);
  const lib = window.pdfjsLib; lib.GlobalWorkerOptions.workerSrc = LIBS.pdfWorker;
  return await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
}
async function pdfText(doc) {
  const out = [];
  for (let i = 1; i <= doc.numPages; i++) {
    const page = await doc.getPage(i); const c = await page.getTextContent();
    // pdf.js returns Hebrew runs in visual order on some files; keep items in reading order per line.
    out.push(c.items.map((it) => it.str + (it.hasEOL ? "\n" : " ")).join(""));
  }
  return out.join("\n\n").replace(/[ \t]+\n/g, "\n").trim();
}
/** Some Hebrew PDFs store text in visual order, so extracted words come out backwards. */
function looksReversed(t) {
  const count = (re) => (t.match(re) || []).length;
  const normal = count(/(^|\s)(של|את|על|לא|הוא|היא|מה|גם|כי|אם|עם|זה)(?=\s|$)/g);
  const reversed = count(/(^|\s)(לש|תא|לע|אל|אוה|איה|המ|םג|יכ|םא|םע|הז)(?=\s|$)/g);
  return hasHeb(t) && reversed > normal;
}
async function pdfImages(doc, maxPages) {
  const blobs = [];
  for (let i = 1; i <= Math.min(doc.numPages, maxPages); i++) {
    const page = await doc.getPage(i); const vp = page.getViewport({ scale: 1.6 });
    const canvas = document.createElement("canvas"); canvas.width = vp.width; canvas.height = vp.height;
    await page.render({ canvasContext: canvas.getContext("2d"), viewport: vp }).promise;
    blobs.push(await new Promise((r) => canvas.toBlob(r, "image/jpeg", 0.85)));
  }
  return blobs;
}
async function ocrImages(blobs) {
  const lim = await caps.sample?.limits?.().catch(() => null);
  if (!lim?.images) throw new Error("שליחת תמונות ל-Claude לא זמינה כאן. העלה קובץ עם טקסט (Word או PDF שאפשר לסמן בו טקסט).");
  const max = lim.images.maxCount || 5; const out = [];
  for (let i = 0; i < blobs.length; i += max) out.push(await askText(P_.ocr(), { images: blobs.slice(i, i + max) }));
  return out.join("\n\n---\n\n");
}
/** Turns any supported file into text; scanned PDFs and images go through Claude's vision. */
async function fileToText(file, onStage) {
  const name = file.name.toLowerCase();
  if (/\.(txt|md)$/.test(name) || file.type.startsWith("text/") && !/\.(vtt|srt)$/.test(name)) return readAsText(file);
  if (/\.(vtt|srt)$/.test(name)) return cleanSubtitles(await readAsText(file));
  if (/\.docx$/.test(name)) { onStage?.("קורא את קובץ ה-Word…"); return docxText(file); }
  if (/\.pdf$/.test(name)) {
    onStage?.("קורא את ה-PDF…");
    const doc = await pdfDoc(file); const t = await pdfText(doc);
    if (t.replace(/\s/g, "").length > 200 * Math.min(doc.numPages, 3) && !looksReversed(t)) return t;
    onStage?.("Claude קורא את עמודי ה-PDF…");
    return ocrImages(await pdfImages(doc, 12));
  }
  if (file.type.startsWith("image/")) { onStage?.("Claude קורא את התמונה…"); return ocrImages([file]); }
  throw new Error("סוג קובץ לא נתמך. אפשר: TXT, Word, PDF, תמונה, VTT או SRT.");
}

/** Word has no LaTeX: turn common math into readable plain text (E = (%ΔQ)/(%ΔP)). */
function texToText(t) {
  const SYM = { alpha: "α", beta: "β", gamma: "γ", delta: "δ", Delta: "Δ", epsilon: "ε", theta: "θ", lambda: "λ", mu: "μ", pi: "π", rho: "ρ", sigma: "σ", Sigma: "Σ", tau: "τ", phi: "φ", omega: "ω", Omega: "Ω",
    cdot: "·", times: "×", div: "÷", pm: "±", le: "≤", leq: "≤", ge: "≥", geq: "≥", neq: "≠", ne: "≠", approx: "≈", infty: "∞", to: "→", rightarrow: "→", Rightarrow: "⇒", leftarrow: "←", sum: "Σ", int: "∫", partial: "∂", in: "∈", forall: "∀", exists: "∃", cup: "∪", cap: "∩", ldots: "…", cdots: "⋯" };
  let x = String(t);
  for (let i = 0; i < 6; i++) {
    const before = x;
    x = x.replace(/\\[dt]?frac\{([^{}]*)\}\{([^{}]*)\}/g, (_, a, b) => `(${a})/(${b})`)
      .replace(/\\sqrt\{([^{}]*)\}/g, "√($1)")
      .replace(/\\(?:text|mathrm|mathbf|operatorname)\{([^{}]*)\}/g, "$1")
      .replace(/\^\{([^{}]*)\}/g, "^$1").replace(/_\{([^{}]*)\}/g, "_$1");
    if (x === before) break;
  }
  return x.replace(/\\left|\\right/g, "").replace(/\\%/g, "%").replace(/\\,|\\;|\\!|\\ /g, " ")
    .replace(/\\([A-Za-z]+)( ?)/g, (m, w, sp) => (SYM[w] ? SYM[w] + (/^[a-zA-Z]+$/.test(w) && /[α-ωΑ-Ω]/.test(SYM[w]) ? "" : sp) : m))
    .replace(/\^\{([^{}]*)\}/g, "^$1").replace(/_\{([^{}]*)\}/g, "_$1")
    .replace(/\(([A-Za-z0-9α-ωΔΣΩ%.]+)\)\/\(([A-Za-z0-9α-ωΔΣΩ%.]+)\)/g, "$1/$2")
    .replace(/[{}]/g, "").replace(/\s+/g, " ").trim();
}

async function buildDocx({ headerText, titlePage, sections }) {
  const d = await getDocx();
  const { Document, Packer, Paragraph, TextRun, HeadingLevel, AlignmentType, Table, TableRow, TableCell, WidthType, BorderStyle, ShadingType, PageBreak, Header, Footer, PageNumber, LevelFormat } = d;
  const FONT = { ascii: "David", hAnsi: "David", cs: "David", eastAsia: "David" };
  const MONO = { ascii: "Consolas", hAnsi: "Consolas", cs: "David", eastAsia: "Consolas" };
  const PLUM = "3D2466", GOLD = "A87A10", MUTED = "6A6280", SOFT = "EFE9F8", LINE = "D9D2E9";
  const LRE = "\u202A", PDF = "\u202C";

    const rtl = hasHeb(text); const size = o.size || 24;

  };
  const para = (children, o = {}) => new Paragraph({ bidirectional: true, alignment: AlignmentType.START, children, ...o });
  const H = [HeadingLevel.HEADING_1, HeadingLevel.HEADING_2, HeadingLevel.HEADING_3, HeadingLevel.HEADING_4];
  const borders = Object.fromEntries(["top", "bottom", "left", "right", "insideHorizontal", "insideVertical"].map((k) => [k, { style: BorderStyle.SINGLE, size: 4, color: LINE }]));
  const cell = (children, head, w) => new TableCell({ width: { size: w, type: WidthType.PERCENTAGE }, shading: head ? { type: ShadingType.CLEAR, color: "auto", fill: SOFT } : undefined, margins: { top: 60, bottom: 60, left: 100, right: 100 }, children: [para(children, { spacing: { after: 0 } })] });
  let listInst = 0;
  const inline = (tokens, st = {}) => {
    const out = [];
    for (const t of tokens || []) {

async function ensureDriveFolder(settings) {

/* =====================================================================
   Recording. Claude pages can't open the microphone, so the live recorder (recorder.html,
   published next to this page) runs in its own small window. It streams the live transcript
   here over postMessage, takes pause / star / note / stop from here, and hands the full text
   over at the end. While recording, the transcript is backed up to the cloud every few minutes.
   Fallbacks: "העתק לממלכה" + Ctrl+V anywhere on the site, or a TXT file carrying REC_MARK.
   ===================================================================== */
const REC_MARK = "[הממלכה של גל · תמלול]";

function parseRecording(raw) {
  const t = String(raw || "").replace(/\r\n?/g, "\n").replace(/^[\s‎‏﻿]+/, "");
  if (!t.startsWith(REC_MARK)) return null;
  const rest = t.slice(REC_MARK.length).replace(/^[ \t]*\n/, "");
  const cut = rest.indexOf("\n\n");
  const head = cut < 0 ? rest : rest.slice(0, cut);
  const text = cut < 0 ? "" : rest.slice(cut + 2).trim();

  return { title: field("שם השיעור"), date: field("תאריך"), seconds, text };
}

addEventListener("message", (e) => {
  const d = e.data;
  if (!d || d.kr !== 1 || typeof d.type !== "string" || !e.source || e.source === window) return;
  const s = recHub.s;
  if (e.source !== s.win) {
    // A recorder opened from this page before it reloaded: adopt it.
    if (d.type !== "ready" && d.type !== "tick") return;
    recHub.set({ win: e.source, ready: true });
    if (d.type === "tick") recPost({ type: "hello" });
  }
  if (d.type === "ready") {
    recHub.set({ ready: true, opened: 0 });
    recPost({ type: "hello", title: recHub.s.wantTitle, start: recHub.s.wantStart });
    recHub.set({ wantStart: false });
  } else if (d.type === "tick") {
    const prev = recHub.s.live;
    const base = Math.max(0, Math.floor(+d.base || 0));
    const have = prev?.lines || [];
    if (base > have.length) { recPost({ type: "hello" }); return; } // missed an update: ask for everything again
    const incomingLines = (Array.isArray(d.lines) ? d.lines : []).map((l) => ({ t: +l.t || 0, text: String(l.text || ""), kind: String(l.kind || "speech") }));
    const live = { status: String(d.status), seconds: +d.seconds || 0, words: +d.words || 0, title: String(d.title || ""), interim: String(d.interim || ""), restore: !!d.restore, saved: !!d.saved, error: String(d.error || ""), speech: d.speech !== false, at: Date.now(), lines: [...have.slice(0, base), ...incomingLines] };

    if (live.status === "rec") {
      if (!recHub.s.lastBackup) patchHub.lastBackup = Date.now();
      else if (Date.now() - recHub.s.lastBackup > BACKUP_EVERY) { patchHub.lastBackup = Date.now(); recPost({ type: "pull", reason: "backup" }); }
    }
    if (live.status === "idle") patchHub.lastBackup = 0;
    recHub.set(patchHub);
  } else if (d.type === "full" && typeof d.text === "string") {
    const p = parseRecording(d.text); if (!p || !p.text) return;
    saveDraft(d.text, p).catch(() => {});
    if (d.reason !== "backup") recHub.set({ incoming: { ...p, courseId: recHub.s.courseId || "", fromRecorder: true } });
  } else if (d.type === "closed") {
    const wasLive = recLive();
    recHub.set({ win: null, ready: false, live: null });
    if (wasLive) pushToast("חלון המקליט נסגר באמצע ההקלטה. התמלול נשמר כגיבוי, ואפשר לפתוח את המקליט שוב ולהמשיך.", "bad");
  }
});

function openRecorder({ courseId, title, start }) {
  recHub.set({ courseId: courseId || "", wantTitle: title || "", wantStart: !!start, blocked: false, severed: false });
  rememberCourse(courseId);
  const s = recHub.s;
  if (s.win && !s.win.closed) {
    try { s.win.focus(); } catch {}
    if (s.ready) { recPost({ type: "hello", title, start }); recHub.set({ wantStart: false }); }
    return;
  }
  let w = null;
  try { w = window.open(REC_FILE, "kingdom-recorder", "popup=yes,width=1040,height=820"); } catch {}
  if (!w) { recHub.set({ blocked: true }); return; }
  recHub.set({ win: w, ready: false, opened: Date.now(), live: null });
}
async function downloadRecorder() {
  const r = await fetch(REC_FILE); if (!r.ok) throw new Error("לא הצלחתי לטעון את המקליט.");
  return saveFile("מקליט הממלכה.html", await r.text());
}

/** Lives in App: paste detection, the import dialog, the floating "recording" pill, window watch. */
function RecordingHub({ store, route }) {
  const hub = useRecHub();
  const routeCourse = route.startsWith("c-") ? route.slice(2) : route.startsWith("l-") ? store.lessons.find((l) => l.id === route.slice(2))?.courseId || "" : route.startsWith("rec-") ? route.slice(4) : "";
  useEffect(() => {
    const onPaste = (e) => {
      const p = parseRecording(e.clipboardData?.getData("text/plain"));
      if (!p) return;
      e.preventDefault(); e.stopPropagation();
      if (!p.text) return pushToast("התמלול שהודבק ריק.", "bad");
      recHub.set({ incoming: { ...p, courseId: "" } });
    };
    document.addEventListener("paste", onPaste, true);
    const t = setInterval(() => {
      const s = recHub.s;
      if (!s.win || !s.win.closed) return;
      // Closed before it ever said hello: the browser cut the link to this page (it still records on its own).
      if (!s.ready && s.opened && Date.now() - s.opened < 8000) return recHub.set({ win: null, opened: 0, severed: true });
      const wasLive = recLive(s);
      recHub.set({ win: null, ready: false, live: null, opened: 0 });
      if (wasLive) pushToast("חלון המקליט נסגר. התמלול נשמר כגיבוי, ואפשר לפתוח את המקליט שוב ולהמשיך.", "bad");
    }, 2000);
    return () => { document.removeEventListener("paste", onPaste, true); clearInterval(t); };
  }, []);
  useEffect(() => {
    if (!store.loaded) return;
    col("recdrafts").doc("meta").get().then((sn) => { if (sn.exists) recHub.set({ draft: sn.data() }); }).catch(() => {});
  }, [store.loaded]);
  const live = hub.live;
  const onRecPage = route === "rec" || route.startsWith("rec-");
  return html`
    ${live && !onRecPage && (recLive(hub) || (live.status === "done" && !live.saved && live.words > 0)) && html`
      <a class="recbar" href=${"#rec" + (hub.courseId ? "-" + hub.courseId : "")}>
        ${recLive(hub) ? html`<span class=${"recdot" + (live.status === "paused" ? " off" : "")}></span><span>${live.status === "paused" ? "מושהה" : "מקליט"}</span><b class="ltr">${hms(live.seconds)}</b><span class="tiny">${live.words.toLocaleString("he-IL")} מילים</span>` : html`<${Icon} n="check" /><span>ההקלטה הסתיימה: לשמירה בקורס</span>`}
      </a>`}
    ${hub.incoming && store.loaded && html`<${ImportRecording} key=${hub.incoming.text.length + hub.incoming.title} store=${store} incoming=${hub.incoming} fallbackCourseId=${routeCourse} onClose=${(saved) => { if (!saved && (hub.incoming.fromRecorder || hub.incoming.fromDraft) && recHub.s.draft) pushToast("התמלול שמור כגיבוי. אפשר לשמור אותו מאוחר יותר בדף ״הקלטה״."); recHub.set({ incoming: null }); }} />`}`;
}

function CourseSelect({ id, courses, value, onChange, allowNew }) {
  return html`<select id=${id} class="select" value=${value} onChange=${(e) => onChange(e.target.value)}>
    ${courses.map((c) => html`<option value=${c.id}>${c.name}</option>`)}
    ${allowNew && html`<option value="__new">+ קורס חדש</option>`}
  </select>`;
}

/** "Which course is this recording for?" — then save (and summarize). */
function ImportRecording({ store, incoming, fallbackCourseId, onClose }) {
  const courses = [...store.courses].sort((a, b) => a.createdAt - b.createdAt);
  const pick = [incoming.courseId, fallbackCourseId, lastCourse()].find((id) => id && courses.some((c) => c.id === id)) || courses[courses.length - 1]?.id || "__new";
  const [cid, setCid] = useState(pick);
  const [newName, setNewName] = useState("");
  const generic = !incoming.title || incoming.title === "שיעור";
  const [title, setTitle] = useState(generic ? "" : incoming.title);
  const [busy, setBusy] = useState(false);
  const count = store.lessons.filter((l) => l.courseId === cid).length;
  const text = incoming.text || "";
  async function save(auto) {
    if (cid === "__new" && !newName.trim()) return pushToast("כתוב שם לקורס החדש", "bad");
    setBusy(true);
    try {
      let course = courses.find((c) => c.id === cid);
      if (!course) {
        const id = newId(); const data = { name: newName.trim(), vocabulary: "", color: COLORS[courses.length % COLORS.length], examDate: null, createdAt: Date.now() };
        await put("courses", id, data); course = { id, ...data };
      }
      const n = store.lessons.filter((l) => l.courseId === course.id).length;
      const { id, lesson } = await createLesson({ course, title: title.trim() || `שיעור ${n + 1}`, text, source: "recorder", minutes: incoming.seconds ? Math.max(1, Math.round(incoming.seconds / 60)) : 0 });
      rememberCourse(course.id);
      if (incoming.fromRecorder) recPost({ type: "saved" });
      if (incoming.fromRecorder || incoming.fromDraft) dropDraft().catch(() => {});
      onClose(true); go("l-" + id);
      pushToast(`נשמר בקורס "${course.name}"`, "good");
      if (auto) processLesson({ id, ...lesson }, course, pushToast);
    } catch (e) { pushToast("השמירה נכשלה: " + (e.message || e.code), "bad"); setBusy(false); }
  }
  return html`<${Modal} title="שמירת ההקלטה בקורס" onClose=${() => onClose(false)}>
    <div class="row" style="gap:8px">${incoming.seconds > 0 && html`<span class="chip">משך ${hms(incoming.seconds)}</span>`}<span class="chip">${words(text).toLocaleString("he-IL")} מילים</span>${incoming.date && html`<span class="chip">${incoming.date}</span>`}</div>
    <div class="grid2" style="gap:12px">
      <div><label class="lbl" for="ir-course">קורס</label>${courses.length ? html`<${CourseSelect} id="ir-course" courses=${courses} value=${cid} onChange=${setCid} allowNew />` : html`<input id="ir-course" class="input" value="קורס חדש" disabled />`}</div>
      <div><label class="lbl" for="ir-title">שם השיעור</label><input id="ir-title" class="input" value=${title} placeholder=${`שיעור ${count + 1}`} onInput=${(e) => setTitle(e.target.value)} /></div>
    </div>
    ${cid === "__new" && html`<div><label class="lbl" for="ir-new">שם הקורס החדש</label><input id="ir-new" class="input" value=${newName} onInput=${(e) => setNewName(e.target.value)} placeholder="לדוגמה: מבוא לכלכלה" autofocus /></div>`}
    <div><span class="lbl">תחילת התמלול</span><div class="quote small" dir=${dirOf(text)}>${text.slice(0, 420)}${text.length > 420 ? "…" : ""}</div></div>
    <div class="row"><button class="btn primary" disabled=${busy || !text.trim()} onClick=${() => save(true)}><${Icon} n="spark" />שמור וסכם</button><button class="btn ghost" disabled=${busy || !text.trim()} onClick=${() => save(false)}>רק לשמור</button></div>
  <//>`;
}

/** The recording page: choose course → record → live transcript + controls → saved into the course. */
function RecordPage({ store, courseId }) {
  const hub = useRecHub();
  const courses = [...store.courses].sort((a, b) => a.createdAt - b.createdAt);
  const valid = (id) => id && courses.some((c) => c.id === id);
  const [cid, setCid] = useState("");
  const [title, setTitle] = useState("");
  const [noteText, setNoteText] = useState("");
  const [busy, setBusy] = useState("");
  const [showAll, setShowAll] = useState(false);
  const [ask, setAsk] = useState(null);
  const [, tick] = useState(0);
  useEffect(() => { const t = setInterval(() => tick((x) => x + 1), 5000); return () => clearInterval(t); }, []);
  const boxRef = useRef();
  const chosen = [cid, courseId, hub.courseId, lastCourse()].find(valid) || courses[courses.length - 1]?.id || "";
  const course = courses.find((c) => c.id === chosen);
  const live = hub.live;
  const recording = recLive(hub);
  const lines = live?.lines || [];
  const shown = showAll ? lines : lines.slice(-200);
  useEffect(() => { const b = boxRef.current; if (b && b.scrollHeight - b.scrollTop - b.clientHeight < 200) b.scrollTop = b.scrollHeight; }, [lines.length, live?.interim, lines[lines.length - 1]?.text]);
  if (!store.loaded) return html`<${Busy} label="טוען…" />`;
  const nextTitle = course ? `שיעור ${store.lessons.filter((l) => l.courseId === course.id).length + 1}` : "שיעור";
  const start = () => openRecorder({ courseId: chosen, title: title.trim() || nextTitle, start: true });
  const cmd = (c, extra = {}) => recPost({ type: "cmd", cmd: c, ...extra });
  const stale = recording && Date.now() - live.at > 60000;
  const linkSlow = !!(hub.severed || (hub.opened && !hub.ready && Date.now() - hub.opened > 6000));
  const showLive = recording || (live?.status === "done" && !live.saved && lines.length > 0);
  const draftNotice = hub.draft && !recording && html`<div class="notice row between"><span>נמצא גיבוי של הקלטה שעוד לא נשמרה כשיעור${hub.draft.title ? html`: <b>${hub.draft.title}</b>` : ""} (${hub.draft.seconds ? hms(hub.draft.seconds) + ", " : ""}${fmtDate(hub.draft.savedAt)}).</span>
    <span class="row"><button class="btn primary sm" disabled=${!!busy} onClick=${async () => { setBusy("draft"); try { await importDraft(); } catch (e) { pushToast(e.message, "bad"); } finally { setBusy(""); } }}>שמירה בקורס</button><button class="btn ghost sm" onClick=${() => setAsk("drop")}>מחיקה</button></span></div>`;

  return html`
    <section class="stack" style="gap:4px"><h1>הקלטת שיעור</h1><p class="muted">מקליטים את השיעור, התמלול מופיע כאן בזמן אמת, ובסוף הוא נשמר בקורס ו-Claude מסכם אותו.</p></section>
    ${draftNotice}
    ${ask === "drop" && html`<${Confirm} title="מחיקת הגיבוי" text="הגיבוי של ההקלטה יימחק לצמיתות." action="מחיקה" onYes=${() => dropDraft()} onClose=${() => setAsk(null)} />`}
    ${ask === "stop" && html`<${Confirm} title="סיום השיעור" text="ההקלטה תיעצר, ואז בוחרים קורס ושומרים את התמלול." action="סיום ושמירה" danger=${false} onYes=${() => cmd("stop")} onClose=${() => setAsk(null)} />`}
    ${showLive ? html`
      <section class="card stack rec-live">
        <div class="row between">
          <div class="row" style="gap:10px">${recording ? html`<span class=${"recdot" + (live.status === "paused" ? " off" : "")}></span><b>${live.status === "paused" ? "ההקלטה מושהית" : "מקליט ומתמלל"}</b>` : html`<span class="chip good">ההקלטה הסתיימה</span>`}
            <span class="muted small">${course ? course.name + " · " : ""}${live.title || nextTitle}</span></div>
          <div class="row" style="gap:14px"><span class="rec-clock">${hms(live.seconds)}</span><span class="muted small">${live.words.toLocaleString("he-IL")} מילים</span></div>
        </div>
        ${recording && html`<div class="row">
          <button class="btn ghost" onClick=${() => cmd(live.status === "paused" ? "resume" : "pause")}>${live.status === "paused" ? "המשך הקלטה" : "השהיה (הפסקה)"}</button>
          <button class="btn ghost" onClick=${() => { cmd("star"); pushToast("סומן כרגע חשוב ⭐"); }} title="מסמן את הרגע הזה בתמלול">⭐ רגע חשוב</button>
          <button class="btn primary" onClick=${() => setAsk("stop")}><span style="width:12px;height:12px;border-radius:3px;background:currentColor;display:inline-block"></span>סיום השיעור</button>
        </div>
        <form class="row" onSubmit=${(e) => { e.preventDefault(); if (noteText.trim()) { cmd("note", { text: noteText.trim() }); setNoteText(""); } }}><input class="input grow" style="min-width:0" value=${noteText} onInput=${(e) => setNoteText(e.target.value)} placeholder="פתק עם חותמת זמן (למשל: ״זה יהיה במבחן״)" aria-label="פתק" /><button class="btn ghost">הוספה</button></form>`}
        ${live.error && html`<div class="notice bad small">${live.error}</div>`}
        ${recording && !live.speech && html`<div class="notice small">הדפדפן של חלון המקליט לא תומך בתמלול חי. ההקלטה הקולית נשמרת בחלון. לתמלול חי פתח את הממלכה ב-Chrome או ב-Edge.</div>`}
        ${stale && html`<div class="notice small">לא הגיע עדכון מהמקליט כבר יותר מדקה. ודא שחלון המקליט פתוח ולא ממוזער.</div>`}
        <div class="live-box" ref=${boxRef} aria-live="polite">
          ${lines.length > shown.length && html`<button class="btn quiet sm" onClick=${() => setShowAll(true)}>הצגת כל התמלול (${lines.length} קטעים)</button>`}
          ${shown.map((l) => html`<p><span class="ts">${hms(l.t)}</span><span class=${l.kind === "speech" ? "" : "mark"} dir=${dirOf(l.text)}>${l.text}</span></p>`)}
          ${live.interim && html`<p class="muted">${live.interim}</p>`}
          ${!lines.length && !live.interim && html`<p class="muted">${live.status === "done" ? "לא נקלט תמלול." : "מקשיב… התמלול יופיע כאן ברגע שהמרצה מדבר."}</p>`}
        </div>
        ${recording ? html`<p class="hint">השאר את חלון המקליט פתוח (אפשר להזיז אותו הצידה, לא למזער). אפשר לעבור לדפים אחרים באתר בזמן ההקלטה. התמלול מגובה לענן כל כמה דקות.</p>`
          : html`<div class="row"><button class="btn gold" onClick=${() => recPost({ type: "pull", reason: "send" })}><${Icon} n="check" />שמירה בקורס</button></div>`}
      </section>`
    : html`
      <section class="card stack">
        ${live?.restore && html`<div class="notice">בחלון המקליט נמצאה הקלטה קודמת שלא הועברה. עבור לחלון המקליט ובחר אם להמשיך אותה או להעביר אותה לכאן.</div>`}
        <div class="grid2" style="gap:12px">
          <div><label class="lbl" for="rp-course">קורס</label>${courses.length ? html`<${CourseSelect} id="rp-course" courses=${courses} value=${chosen} onChange=${setCid} />` : html`<p class="small muted">אפשר להקליט עכשיו ולבחור או ליצור קורס בסוף.</p>`}</div>
          <div><label class="lbl" for="rp-title">שם השיעור</label><input id="rp-title" class="input" value=${title} placeholder=${nextTitle} onInput=${(e) => setTitle(e.target.value)} /></div>
        </div>
        <div><button class="btn gold lg" onClick=${start}><${Icon} n="mic" />התחלת הקלטה</button></div>
        <p class="hint">ההקלטה רצה בחלון קטן של הממלכה שנפתח לצד הדף, כי Claude לא מאפשר לדפים שלו להשתמש במיקרופון ישירות. התמלול החי והשליטה בהקלטה נשארים כאן. בפעם הראשונה הדפדפן יבקש אישור למיקרופון. הכי טוב ב-Chrome או ב-Edge במחשב.</p>
        ${hub.blocked && html`<div class="notice bad small">הדפדפן לא אפשר לפתוח את חלון המקליט. <a href=${REC_FILE} target="_blank">פתח את המקליט בלשונית חדשה</a>, או הורד אותו למחשב (למטה). בסוף השיעור לוחצים בו ״העתק לממלכה״ ומדביקים כאן (Ctrl+V).</div>`}
        ${linkSlow && html`<div class="notice small">חלון המקליט נפתח, אבל הוא לא מחובר לדף הזה. אפשר להקליט בו כרגיל: בסוף השיעור לוחצים בו ״העתק לממלכה״, חוזרים לכאן ולוחצים Ctrl+V. אם החלון ריק או שהמיקרופון חסום בו, הורד את המקליט למחשב (למטה).</div>`}
        ${live?.error && html`<div class="notice bad small">${live.error}</div>`}
      </section>
      <section class="grid2">
        <div class="card stack">
          <h3>המיקרופון חסום בחלון? מקליט במחשב</h3>
          <p class="small muted">מורידים את המקליט פעם אחת, פותחים את הקובץ ב-Chrome ומקליטים. בסוף השיעור לוחצים ״העתק לממלכה״, ואז Ctrl+V בכל מקום באתר.</p>
          <div><button class="btn ghost" disabled=${busy === "dl"} onClick=${async () => { setBusy("dl"); try { if (await downloadRecorder()) pushToast("המקליט ירד למחשב. פתח אותו ב-Chrome.", "good"); } catch (e) { pushToast(e.message, "bad"); } finally { setBusy(""); } }}><${Icon} n="upload" />הורדת המקליט למחשב</button></div>
        </div>
        <div class="card stack">
          <h3>יש לך כבר תמלול?</h3>
          <p class="small muted">לחץ בתיבה והדבק (Ctrl+V) תמלול מהמקליט, מהקלדה קולית בגוגל דוקס או מכל מקום אחר.</p>
          <textarea class="textarea" style="min-height:70px" placeholder="הדבק כאן…" aria-label="הדבקת תמלול" onPaste=${(e) => { const t = e.clipboardData?.getData("text/plain") || ""; if (t.trim() && !parseRecording(t)) { e.preventDefault(); recHub.set({ incoming: { title: "", seconds: 0, date: "", text: t.trim(), courseId: chosen } }); } }}></textarea>
        </div>
      </section>`}`;
}

/* =====================================================================
   App
   ===================================================================== */
function App() {
  const [boot, setBoot] = useState("loading");
  useEffect(() => { bootCaps().then(setBoot); }, []);
  const store = useStore(boot === "ok");
  const route = useRoute();
  if (boot === "loading") return html`<div class="wrap" style="padding-block:40px"><${Busy} label="טוען את הממלכה…" /></div>`;
  if (boot !== "ok") return html`<${Outside} reason=${boot} />`;
  let view;
  if (route.startsWith("c-")) view = html`<${CourseView} id=${route.slice(2)} store=${store} />`;
  else if (route.startsWith("l-")) view = html`<${LessonView} id=${route.slice(2)} store=${store} />`;
  else if (route === "review") view = html`<${ReviewView} store=${store} />`;
  else if (route === "search") view = html`<${SearchView} store=${store} />`;
  else if (route === "help") view = html`<${HelpView} />`;
  else if (route === "prefs") view = html`<${PrefsView} store=${store} />`;
  else if (route === "rec" || route.startsWith("rec-")) view = html`<${RecordPage} store=${store} courseId=${route.slice(4)} />`;
  else view = html`<${Home} store=${store} />`;
  const due = store.cards.filter(isDue).length;
  const cur = route.split("-")[0];
  return html`
    <header class="top"><div class="wrap">
      <a class="brand" href="#"><span class="brand-mark"><${Icon} n="crown" s=${20} /></span><span><b>הממלכה של גל</b><small class="muted tiny" style="display:block;margin-top:-4px">סיכומים · תרגול · מבחנים</small></span></a>
      <nav class="nav" aria-label="ניווט">
        <a href="#" aria-current=${!route || cur === "c" || cur === "l" ? "page" : undefined}><${Icon} n="home" />בית</a>
        <a href="#rec" aria-current=${cur === "rec" ? "page" : undefined}><${Icon} n="mic" />הקלטה</a>
        <a href="#review" aria-current=${route === "review" ? "page" : undefined}><${Icon} n="cards" />חזרה${due ? ` (${due})` : ""}</a>
        <a href="#search" aria-current=${route === "search" ? "page" : undefined}><${Icon} n="search" />חיפוש</a>
        <a href="#help" aria-current=${route === "help" ? "page" : undefined}><${Icon} n="help" />מדריך</a>
        <a href="#prefs" aria-current=${route === "prefs" ? "page" : undefined}><${Icon} n="gear" />הגדרות</a>
      </nav>
    </div></header>
    <main class="wrap">
      ${store.error && html`<div class="notice bad">לא הצלחתי לגשת לנתונים: ${store.error}</div>`}
      ${store.slow && !store.loaded && html`<div class="notice">הנתונים עדיין נטענים. אם זה נמשך, בדוק את החיבור לאינטרנט.</div>`}
      ${view}
    </main>
    <${RecordingHub} store=${store} route=${route} />
    <${Toasts} />`;
}

function Outside({ reason }) {
  const msg = {
    outside: "האתר הזה עובד בתוך Claude: פתח את הקישור שלו ב-claude.ai, כשאתה מחובר לחשבון שלך.",
    nodb: "הדף לא קיבל גישה לשמירת נתונים. רענן את הדף, או פתח אותו ב-claude.ai.",
    signedout: "כדי לשמור קורסים וסיכומים צריך להיות מחובר לחשבון Claude. התחבר ורענן את הדף.",
  }[reason];
  return html`<main class="wrap" style="padding-block:48px"><div class="card empty"><div class="glyph"><${Icon} n="crown" s=${28} /></div><h1>הממלכה של גל</h1><p class="muted" style="max-width:480px">${msg}</p></div></main>`;
}

/* ---------------- Home ---------------- */
function Home({ store }) {
  const [form, setForm] = useState(false);
  const { courses, lessons, cards } = store;
  if (!store.loaded) return html`<${Busy} label="טוען…" />`;
  const due = cards.filter(isDue);
  const ready = lessons.filter((l) => l.status === "ready");
  const active = lessons.filter((l) => l.status === "processing" || l.status === "error");
  const exams = courses.filter((c) => c.examDate && daysUntil(c.examDate) >= 0).sort((a, b) => a.examDate.localeCompare(b.examDate));
  return html`
    <section class="row between" style="align-items:end">
      <div><p class="muted">${greeting()},</p><h1>${caps.name || "ברוכים הבאים"}</h1></div>
      <div class="row"><a class="btn gold" href="#rec"><${Icon} n="mic" />הקלטת שיעור</a><button class="btn ghost" onClick=${() => setForm(true)}><${Icon} n="plus" />קורס חדש</button></div>
    </section>
    ${!courses.length ? html`
      <div class="card stack" style="padding:28px">
        <h2>ברוכים הבאים לממלכה</h2>
        <p class="muted">כאן כל שיעור הופך למחברת: סיכום מלא לפי נושאים, מבחן אמריקאי, שאלות פתוחות עם בדיקה, כרטיסיות לחזרה, ומחברת קורס שאפשר להוריד ל-Word. הכל רץ בתוך Claude, בלי שרתים ובלי תשלום נוסף.</p>
        <ol class="steps">
          <li><span><b>יוצרים קורס</b> (למשל "מבוא לכלכלה").</span></li>
          <li><span><b>מקליטים שיעור</b> בכפתור <a href="#rec">הקלטה</a>, והתמלול מופיע בזמן אמת. אפשר גם לייבא תמלול מגוגל דרייב, להעלות קובץ או להדביק טקסט.</span></li>
          <li><span><b>לוחצים "סכם"</b> ומקבלים סיכום, מבחן, כרטיסיות ושאלות פתוחות.</span></li>
        </ol>
        <div><button class="btn gold lg" onClick=${() => setForm(true)}>יצירת קורס ראשון</button></div>
      </div>` : html`
      <section class="grid3">
        <div class="card stat"><b>${courses.length}</b><span class="muted small">קורסים</span></div>
        <div class="card stat"><b>${ready.length}</b><span class="muted small">שיעורים מסוכמים</span></div>
        <a class="card stat" href="#review" style="text-decoration:none;color:inherit"><b style="color:var(--gold)">${due.length}</b><span class="muted small">כרטיסיות לחזרה היום</span></a>
      </section>
      ${active.length > 0 && html`<section class="stack"><h2>בעבודה</h2>${active.map((l) => html`<a class="card tight list-item" href=${"#l-" + l.id}><div class="grow"><b class="truncate" style="display:block">${l.title}</b><span class="small muted">${l.status === "error" ? l.error : l.progress || ""}</span></div><${StatusChip} s=${l.status} /></a>`)}</section>`}
      ${exams.length > 0 && html`<section class="stack"><h2>מבחנים קרובים</h2><div class="grid2">${exams.map((c) => { const d = daysUntil(c.examDate); const tot = (c.plan?.days || []).reduce((s, x) => s + x.tasks.length, 0); const done = (c.planDone || []).length; return html`<a class="card tight list-item" href=${"#c-" + c.id}><div class="num" style="background:var(--gold-soft);color:var(--gold);width:54px;height:54px;flex-direction:column;line-height:1"><b>${d}</b><span class="tiny">ימים</span></div><div class="grow stack" style="gap:4px"><b>${c.name}</b><span class="small muted">${fmtDate(c.examDate + "T00:00:00")}</span>${tot ? html`<${Bar} v=${done / tot} /><span class="tiny muted">${done}/${tot} משימות בתוכנית</span>` : html`<span class="small" style="color:var(--plum)">בנה תוכנית לימוד</span>`}</div></a>`; })}</div></section>`}
      <section class="stack"><h2>הקורסים שלי</h2><div class="grid2">
        ${[...courses].sort((a, b) => a.createdAt - b.createdAt).map((c) => { const ls = lessons.filter((l) => l.courseId === c.id); const cd = due.filter((x) => x.courseId === c.id).length; const d = c.examDate ? daysUntil(c.examDate) : null; return html`
          <a class="card course-card" href=${"#c-" + c.id}><span class="stripe" style=${{ background: c.color }}></span>
            <h3>${c.name}</h3><span class="small muted">${ls.length} שיעורים · ${ls.filter((l) => l.status === "ready").length} מסוכמים</span>
            <div class="row" style="gap:6px">${cd > 0 && html`<span class="chip gold">${cd} כרטיסיות לחזרה</span>`}${d !== null && d >= 0 && html`<span class="chip">מבחן בעוד ${d} ימים</span>`}${c.notebook && html`<span class="chip">יש מחברת</span>`}</div></a>`; })}
      </div></section>`}
    ${form && html`<${CourseForm} onClose=${() => setForm(false)} onSaved=${(id) => go("c-" + id)} count=${courses.length} />`}`;
}

function CourseForm({ course, onClose, onSaved, count = 0 }) {
  const [name, setName] = useState(course?.name || "");
  const [vocab, setVocab] = useState(course?.vocabulary || "");
  const [color, setColor] = useState(course?.color || COLORS[count % COLORS.length]);
  const [exam, setExam] = useState(course?.examDate || "");
  const [busy, setBusy] = useState(false);
  async function save(e) {
    e.preventDefault(); if (!name.trim()) return; setBusy(true);
    try {
      const id = course?.id || newId();
      const data = { name: name.trim(), vocabulary: vocab.trim(), color, examDate: exam || null };
      if (course) await patch("courses", id, data); else await put("courses", id, { ...data, createdAt: Date.now() });
      onSaved?.(id); onClose();
    } catch (err) { pushToast("השמירה נכשלה: " + (err.message || err.code), "bad"); } finally { setBusy(false); }
  }
  return html`<${Modal} title=${course ? "עריכת קורס" : "קורס חדש"} onClose=${onClose}><form class="stack" onSubmit=${save}>
    <div><label class="lbl" for="cf-name">שם הקורס</label><input id="cf-name" class="input" required maxlength="120" value=${name} onInput=${(e) => setName(e.target.value)} placeholder="לדוגמה: מבוא לכלכלה" autofocus /></div>
    <div><label class="lbl" for="cf-vocab">מונחים ושמות שחוזרים בקורס (לא חובה)</label><input id="cf-vocab" class="input" value=${vocab} onInput=${(e) => setVocab(e.target.value)} placeholder="גמישות, עקומת ביקוש, Elasticity" /><p class="hint">עוזר ל-Claude לתקן מונחים שהתמלול זיהה לא נכון.</p></div>
    <div class="row" style="align-items:start;gap:18px">
      <div><span class="lbl">צבע</span><div class="row" style="gap:6px">${COLORS.map((c) => html`<button type="button" aria-label=${"צבע " + c} aria-pressed=${color === c} onClick=${() => setColor(c)} style=${{ width: "30px", height: "30px", borderRadius: "99px", border: color === c ? "3px solid var(--ink)" : "2px solid var(--card)", background: c, cursor: "pointer" }}></button>`)}</div></div>
      <div class="grow" style="min-width:180px"><label class="lbl" for="cf-exam">תאריך מבחן (לא חובה)</label><input id="cf-exam" type="date" class="input" value=${exam || ""} onInput=${(e) => setExam(e.target.value)} /></div>
    </div>
    <div class="row"><button class="btn primary" disabled=${busy || !name.trim()}>${course ? "שמירה" : "יצירת קורס"}</button><button type="button" class="btn ghost" onClick=${onClose}>ביטול</button></div>
  </form><//>`;
}

/* ---------------- Course ---------------- */
function CourseView({ id, store }) {
  const c = store.courses.find((x) => x.id === id);
  const [tab, setTab] = useState(() => { try { return sessionStorage.getItem("ctab-" + id) || "lessons"; } catch { return "lessons"; } });
  const setT = (t) => { setTab(t); try { sessionStorage.setItem("ctab-" + id, t); } catch {} };
  if (!store.loaded) return html`<${Busy} label="טוען…" />`;
  if (!c) return html`<${Empty} icon="search" title="הקורס לא נמצא"><a class="btn primary" href="#">לבית</a><//>`;
  const lessons = store.lessons.filter((l) => l.courseId === id).sort((a, b) => a.createdAt - b.createdAt);
  const cards = store.cards.filter((x) => x.courseId === id);
  const attempts = store.attempts.filter((x) => x.courseId === id);
  const exams = store.exams.filter((x) => x.courseId === id);
  const due = cards.filter(isDue).length;
  const d = c.examDate ? daysUntil(c.examDate) : null;
  const ctx = { c, lessons, cards, attempts, exams, store };
  return html`
    <header class="card course-card" style="padding:22px 24px"><span class="stripe" style=${{ background: c.color, width: "8px" }}></span>
      <div class="row between"><div class="stack" style="gap:6px"><span class="small muted">קורס</span><h1>${c.name}</h1>
        <div class="row" style="gap:6px">${d !== null && d >= 0 && html`<span class="chip gold">מבחן בעוד ${d} ימים</span>`}${due > 0 && html`<span class="chip">${due} כרטיסיות לחזרה</span>`}<span class="chip">${lessons.length} שיעורים</span></div></div>
        <div class="row"><a class="btn gold" href=${"#rec-" + c.id}><${Icon} n="mic" />הקלטה</a><${AddLessonButton} course=${c} lessons=${lessons} /></div></div>
    </header>
    <${Tabs} value=${tab} onChange=${setT} tabs=${[["lessons", "שיעורים"], ["notebook", "מחברת"], ["cards", `כרטיסיות${due ? ` (${due})` : ""}`], ["exams", "מבחנים ותרגול"], ["past", "מבחנים קודמים"], ["chat", "שאל את הקורס"], ["plan", "תוכנית לימוד"], ["edit", "הגדרות"]]} />
    ${tab === "lessons" && html`<${CourseLessons} ...${ctx} />`}
    ${tab === "notebook" && html`<${Notebook} ...${ctx} />`}
    ${tab === "cards" && html`<${CardsTab} cards=${cards} />`}
    ${tab === "exams" && html`<${ExamsTab} ...${ctx} />`}
    ${tab === "past" && html`<${PastExams} ...${ctx} />`}
    ${tab === "chat" && html`<${Chat} key=${"c" + id} storageKey=${"chat-c-" + id} scope=${`הקורס "${c.name}"`} build=${() => courseChatContext(c, lessons, exams)} suggestions=${["מה הנושאים הכי חשובים למבחן?", "מה הקשר בין הנושאים בקורס?", "בחן אותי בשאלה פתוחה", "סכם לי את הקורס בעמוד אחד"]} disabled=${!lessons.some((l) => l.summary)} />`}
    ${tab === "plan" && html`<${PlanTab} ...${ctx} />`}
    ${tab === "edit" && html`<${CourseSettings} c=${c} lessons=${lessons} cards=${cards} exams=${exams} attempts=${attempts} />`}`;
}

async function courseChatContext(c, lessons, exams) {
  let ctx = courseDigest(await withSections(lessons), 170000);
  const style = examStyle(exams);
  if (style) ctx += "\n\n---\nניתוח המבחנים הקודמים:\n" + style;
  return ctx;
}

function AddLessonButton({ course, lessons }) {
  const [open, setOpen] = useState(false);
  return html`<button class="btn primary" onClick=${() => setOpen(true)}><${Icon} n="plus" />שיעור חדש</button>${open && html`<${AddLesson} course=${course} lessons=${lessons} onClose=${() => setOpen(false)} />`}`;
}

/** Add a lesson from Google Drive, a file, or pasted text. */
function AddLesson({ course, lessons, onClose }) {
  const [src, setSrc] = useState("drive");
  const [title, setTitle] = useState(`שיעור ${lessons.length + 1}`);
  const [text, setText] = useState("");
  const [stage, setStage] = useState("");
  const [busy, setBusy] = useState(false);
  const [origin, setOrigin] = useState("");
  const [recSecs, setRecSecs] = useState(0);
  const useText = (t, name) => { // a recorder export carries its own title and length
    const r = parseRecording(t);
    if (r) { setText(r.text); setRecSecs(r.seconds); if (r.title && r.title !== "שיעור") return setTitle(r.title); }
    else { setText(t); setRecSecs(0); }
    if (name && /^שיעור \d+$/.test(title)) setTitle(name.replace(/\.[^.]+$/, ""));
  };

  async function create(autoSummarize) {
    if (!text.trim()) return pushToast("אין עדיין טקסט לשיעור", "bad");
    setBusy(true); setStage("שומר…");
    try {
      const { id, lesson } = await createLesson({ course, title: title.trim() || `שיעור ${lessons.length + 1}`, text, source: origin || src, minutes: recSecs ? Math.max(1, Math.round(recSecs / 60)) : 0 });
      onClose(); go("l-" + id);
      if (autoSummarize) processLesson({ id, ...lesson }, course, pushToast);
    } catch (e) { pushToast("השמירה נכשלה: " + (e.message || e.code), "bad"); setBusy(false); setStage(""); }
  }

  return html`<${Modal} title="שיעור חדש" onClose=${onClose}>
    <a class="opt" href=${"#rec-" + course.id} style="text-decoration:none"><${Icon} n="mic" /><span class="grow"><b>להקליט את השיעור עכשיו</b><span class="small muted" style="display:block">תמלול חי בזמן השיעור, ובסוף סיכום אוטומטי</span></span></a>
    <div><label class="lbl" for="al-title">שם השיעור</label><input id="al-title" class="input" value=${title} onInput=${(e) => setTitle(e.target.value)} /><p class="hint">בסוף הסיכום Claude יציע שם לפי התוכן.</p></div>
    <${Tabs} value=${src} onChange=${(v) => { setSrc(v); }} tabs=${[["drive", "מגוגל דרייב"], ["file", "קובץ מהמחשב"], ["paste", "הדבקה"]]} />
    ${src === "drive" && html`<${DrivePicker} kind="transcript" onPick=${async (f) => { setStage("קורא את הקובץ מהדרייב…"); try { const r = await drive("read_file_content", { fileId: f.id }); useText(resultText(r), f.title); setOrigin("drive"); setStage(""); } catch (e) { setStage(""); pushToast(e.message, "bad"); } }} />`}
    ${src === "file" && html`<${FileDrop} accept=".txt,.md,.vtt,.srt,.docx,.pdf,image/*" label="גרור לכאן קובץ תמלול, או לחץ לבחירה" hint="TXT, Word, PDF, תמונה, או כתוביות VTT / SRT (למשל מזום, טימס או יוטיוב)" onFile=${async (f) => { try { const t = await fileToText(f, setStage); useText(t, f.name); setOrigin("file"); setStage(""); } catch (e) { setStage(""); pushToast(e.message, "bad"); } }} />`}
    ${src === "paste" && html`<p class="small muted">הדבק את התמלול או את הסיכומים שלך מהשיעור.</p>`}
    ${stage && html`<${Busy} label=${stage} />`}
    <div><label class="lbl" for="al-text">טקסט השיעור ${text && html`<span class="muted small">(${words(text).toLocaleString("he-IL")} מילים, כ-${speechMinutes(text.length)} דק׳ דיבור)</span>`}</label>
      <textarea id="al-text" class="textarea" style="min-height:180px" value=${text} onInput=${(e) => setText(e.target.value)} placeholder="כאן יופיע הטקסט. אפשר גם לערוך לפני השמירה."></textarea></div>
    <div class="row"><button class="btn primary" disabled=${busy || !text.trim()} onClick=${() => create(true)}><${Icon} n="spark" />שמור וסכם</button><button class="btn ghost" disabled=${busy || !text.trim()} onClick=${() => create(false)}>רק לשמור</button></div>
  <//>`;
}

function FileDrop({ accept, label, hint, onFile }) {
  const [on, setOn] = useState(false); const ref = useRef();
  return html`<div class=${"drop" + (on ? " on" : "")} onDragOver=${(e) => { e.preventDefault(); setOn(true); }} onDragLeave=${() => setOn(false)} onDrop=${(e) => { e.preventDefault(); setOn(false); const f = e.dataTransfer.files?.[0]; if (f) onFile(f); }}>
    <div class="stack" style="justify-items:center;gap:8px"><${Icon} n="upload" s=${26} /><b>${label}</b><span class="small">${hint}</span>
    <button type="button" class="btn ghost sm" onClick=${() => ref.current.click()}>בחירת קובץ</button></div>
    <input ref=${ref} type="file" accept=${accept} hidden onChange=${(e) => { const f = e.target.files?.[0]; e.target.value = ""; if (f) onFile(f); }} /></div>`;
}

function DrivePicker({ kind, onPick }) {
  const [q, setQ] = useState(""); const [files, setFiles] = useState(null); const [busy, setBusy] = useState(false); const [err, setErr] = useState("");
  const types = kind === "exam"
    ? "(mimeType = 'application/vnd.google-apps.document' or mimeType = 'application/pdf' or mimeType = 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' or mimeType contains 'image/' or mimeType contains 'text/')"
    : "(mimeType = 'application/vnd.google-apps.document' or mimeType = 'application/pdf' or mimeType = 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' or mimeType contains 'text/' or mimeType contains 'video/')";
  async function search(e) {
    e?.preventDefault(); setBusy(true); setErr("");
    try {
      const safe = q.trim().replace(/'/g, "\\'");
      const r = await drive("search_files", { query: `${types} and trashed = false${safe ? ` and title contains '${safe}'` : ""}`, orderBy: "modifiedTime desc", pageSize: 15, excludeContentSnippets: true });
      setFiles(r?.payload?.files || []);
    } catch (e2) { setErr(e2.message); } finally { setBusy(false); }
  }
  useEffect(() => { search(); }, []);
  return html`<div class="stack" style="gap:10px">
    <form class="row" onSubmit=${search}><input class="input grow" placeholder="חיפוש לפי שם הקובץ" value=${q} onInput=${(e) => setQ(e.target.value)} aria-label="חיפוש בדרייב" /><button class="btn ghost">חיפוש</button></form>
    ${busy && html`<${Busy} label="מחפש בדרייב…" />`}
    ${err && html`<div class="notice bad small">${err}</div>`}
    ${files && !busy && (files.length ? html`<div class="stack" style="gap:6px;max-height:240px;overflow-y:auto">${files.map((f) => html`<button type="button" class="opt" onClick=${() => onPick(f)}><${Icon} n="doc" /><span class="grow" style="min-width:0"><b class="truncate" style="display:block" dir=${dirOf(f.title)}>${f.title}</b><span class="tiny muted">${f.modifiedTime ? fmtDate(f.modifiedTime) : ""}</span></span></button>`)}</div>` : html`<p class="small muted">לא נמצאו קבצים.</p>`)}
  </div>`;
}

function CourseLessons({ c, lessons, attempts }) {
  const best = new Map(); for (const a of attempts) if (a.lessonId && a.kind === "lesson") best.set(a.lessonId, Math.max(best.get(a.lessonId) || 0, a.score));
  const pending = lessons.filter((l) => l.status === "new" || l.status === "error");
  const [batch, setBatch] = useState(false);
  if (!lessons.length) return html`<${Empty} icon="book" title="עוד אין שיעורים בקורס" text="מקליטים שיעור עם תמלול חי, או מוסיפים תמלול מגוגל דרייב, מקובץ או מטקסט, ו-Claude מסכם אותו."><a class="btn gold" href=${"#rec-" + c.id}><${Icon} n="mic" />הקלטת שיעור</a><//>`;
  return html`<div class="stack">
    ${pending.length > 1 && html`<div class="notice row between"><span>${pending.length} שיעורים ממתינים לסיכום.</span><button class="btn primary sm" disabled=${batch} onClick=${async () => { setBatch(true); for (const l of pending) await processLesson(l, c, pushToast); setBatch(false); }}>${batch ? "מסכם…" : "סכם את כולם"}</button></div>`}
    ${lessons.map((l, i) => html`<a class="card tight list-item" href=${"#l-" + l.id}><span class="num">${i + 1}</span><span class="grow" style="min-width:0"><b class="truncate" style="display:block">${l.title}</b><span class="tiny muted">${fmtDate(l.createdAt)}${l.minutes ? ` · כ-${l.minutes} דק׳` : ""}${best.has(l.id) ? ` · שיא במבחן ${best.get(l.id)}%` : ""}${l.status === "processing" && l.progress ? ` · ${l.progress}` : ""}</span></span><${StatusChip} s=${l.status} /></a>`)}
  </div>`;
}

/* ---------------- Lesson ---------------- */

  const [tab, setTab] = useState("summary");
  const [edit, setEdit] = useState(false);
  const [confirm, setConfirm] = useState(false);
  const [word, setWord] = useState(false);
  if (!store.loaded) return html`<${Busy} label="טוען…" />`;
  if (!l) return html`<${Empty} icon="search" title="השיעור לא נמצא"><a class="btn primary" href="#">לבית</a><//>`;
  const c = store.courses.find((x) => x.id === l.courseId) || { name: "", id: l.courseId };
  const cards = store.cards.filter((x) => x.lessonId === id);
  const isRunning = l.status === "processing";
  return html`

      ${editing === i ? html`<textarea class="textarea" style="min-height:260px" value=${draft} onInput=${(e) => setDraft(e.target.value)} aria-label="עריכת התוכן"></textarea><div class="row"><button class="btn primary sm" onClick=${() => saveSection(i)}>שמירה</button><button class="btn ghost sm" onClick=${() => setEditing(-1)}>ביטול</button><span class="tiny muted">Markdown: **מודגש**, - רשימה, $x^2$ לנוסחה</span></div>` : html`<${Md} text=${x.content} />`}
    </section>`)}
    ${s.takeaways?.length > 0 && html`<section class="card stack" style="gap:8px;background:var(--gold-soft);border-color:transparent"><h2>הכי חשוב לזכור</h2><ul style="margin:0;padding-inline-start:1.2em">${s.takeaways.map((t) => html`<li>${t}</li>`)}</ul></section>`}
    ${s.keyTerms?.length > 0 && html`<section class="card stack" style="gap:10px"><h2>מושגי מפתח</h2><div class="grid2">${s.keyTerms.map((k) => html`<div class="card tight" style="padding:10px 12px"><b dir=${dirOf(k.term)}>${k.term}</b><p class="small muted">${k.definition}</p></div>`)}</div></section>`}
    ${s.openQuestions?.length > 0 && html`<section class="card stack" style="gap:8px"><h2>משימות ונקודות פתוחות</h2><ul style="margin:0;padding-inline-start:1.2em">${s.openQuestions.map((t) => html`<li>${t}</li>`)}</ul></section>`}
    <div class="row" style="justify-content:center"><button class="btn quiet sm" onClick=${async () => { await patch("lessons", l.id, { partResults: [], status: "new" }); processLesson({ ...l, partResults: [] }, c, pushToast); }}><${Icon} n="spark" />סיכום מחדש</button></div>
  </article>`;

function TranscriptTab({ l }) {
  const [text, setText] = useState(null); const [q, setQ] = useState(""); const [edit, setEdit] = useState(false); const [draft, setDraft] = useState("");
  useEffect(() => { loadText("transcripts", l.id, l.textParts).then(setText).catch(() => setText("")); }, [l.id, l.textParts]);
  if (text === null) return html`<${Busy} label="טוען תמלול…" />`;
  const paras = text.split(/\n{2,}|\n/).filter((p) => p.trim());
  const shown = q.trim() ? paras.filter((p) => p.includes(q.trim())) : paras;
  async function save() {
    const n = await saveText("transcripts", l.id, draft.trim());
    await patch("lessons", l.id, { textParts: n, chars: draft.length, minutes: speechMinutes(draft.length) });
    setText(draft.trim()); setEdit(false); pushToast("התמלול נשמר. אפשר ללחוץ ״סיכום מחדש״ כדי לעדכן את הסיכום.", "good");
  }
  if (edit) return html`<div class="card stack"><textarea class="textarea" style="min-height:420px" value=${draft} onInput=${(e) => setDraft(e.target.value)} aria-label="עריכת התמלול"></textarea><div class="row"><button class="btn primary" onClick=${save}>שמירה</button><button class="btn ghost" onClick=${() => setEdit(false)}>ביטול</button></div></div>`;
  return html`<div class="stack">
    <div class="row"><input class="input grow" placeholder="חיפוש בתמלול" value=${q} onInput=${(e) => setQ(e.target.value)} aria-label="חיפוש בתמלול" /><button class="btn ghost" onClick=${() => { setDraft(text); setEdit(true); }}><${Icon} n="pen" />עריכה</button></div>
    <div class="card stack" style="gap:10px">${shown.length ? shown.map((p) => html`<p dir=${dirOf(p)}>${highlight(p, q.trim())}</p>`) : html`<p class="muted">לא נמצאו תוצאות.</p>`}</div>
  </div>`;
}
function highlight(t, q) { if (!q) return t; const parts = t.split(q); return parts.flatMap((p, i) => (i ? [html`<mark style="background:var(--gold-soft);color:inherit">${q}</mark>`, p] : [p])); }

/* ---------------- Quiz ---------------- */
function LessonQuiz({ l, c }) {
  const [run, setRun] = useState(null); const qs = cleanQuestions(l.quiz);
  if (!qs.length) return html`<${Empty} icon="target" title="המבחן ייווצר יחד עם הסיכום" />`;
  if (run) return html`<${QuizRunner} key=${run.k} questions=${run.qs} mode="practice" onFinish=${(ans, dur) => put("attempts", newId(), { courseId: c.id, lessonId: l.id, kind: run.kind, score: scoreOf(run.qs, ans), questions: run.qs, answers: ans, duration: dur, createdAt: Date.now() }).catch(() => {})} onRestart=${() => setRun({ qs: qs.map(shuffleQ), kind: "lesson", k: Date.now() })} onMistakes=${(w) => setRun({ qs: w.map(shuffleQ), kind: "mistakes", k: Date.now() })} />`;
  return html`<div class="card empty"><div class="glyph"><${Icon} n="target" s=${26} /></div><h2>מבחן הבנה · ${qs.length} שאלות</h2><p class="muted">שאלה אחת בכל פעם, עם משוב והסבר מיד אחרי כל תשובה. מקלדת: 1-4 לבחירה, Enter להמשך.</p><button class="btn primary lg" onClick=${() => setRun({ qs: qs.map(shuffleQ), kind: "lesson", k: Date.now() })}>התחל מבחן</button></div>`;
}

function QuizRunner({ questions, mode, timeLimit, onFinish, onRestart, onMistakes }) {
  const [i, setI] = useState(0); const [ans, setAns] = useState(() => questions.map(() => -1)); const [shown, setShown] = useState(false); const [fin, setFin] = useState(false);
  const start = useRef(Date.now()); const [now, setNow] = useState(Date.now());
  const q = questions[i]; const chosen = ans[i];
  const finish = (a = ans) => { if (fin) return; setFin(true); onFinish?.(a, Math.round((Date.now() - start.current) / 1000)); scrollTo({ top: 0, behavior: "smooth" }); };
  useEffect(() => { if (!timeLimit || fin) return; const t = setInterval(() => setNow(Date.now()), 1000); return () => clearInterval(t); }, [timeLimit, fin]);
  const left = timeLimit ? timeLimit - Math.floor((now - start.current) / 1000) : null;
  useEffect(() => { if (left !== null && left <= 0 && !fin) finish(); }, [left]);
  const choose = (k) => { if (fin || (mode === "practice" && shown)) return; setAns((a) => a.map((v, j) => (j === i ? k : v))); if (mode === "practice") setShown(true); };
  const next = () => { setShown(false); if (i < questions.length - 1) setI(i + 1); else finish(); };
  useEffect(() => { const h = (e) => { if (fin || /INPUT|TEXTAREA/.test(e.target.tagName)) return; const n = +e.key; if (n >= 1 && n <= (q?.options.length || 0)) choose(n - 1); if (e.key === "Enter" && chosen >= 0) next(); }; addEventListener("keydown", h); return () => removeEventListener("keydown", h); });
  if (fin) {
    const sc = scoreOf(questions, ans); const wrong = questions.filter((qq, k) => ans[k] !== qq.correctIndex); const stats = topicStats([{ questions, answers: ans }]);
    return html`<div class="stack">
      <div class="card empty"><${Ring} pct=${sc} /><b>${questions.length - wrong.length} מתוך ${questions.length} נכונות</b><p class="muted">${sc >= 90 ? "מלכותי. שולט בחומר." : sc >= 75 ? "יפה מאוד. עוד קצת ליטוש." : sc >= 55 ? "בכיוון הנכון. כדאי לחזור על הנושאים החלשים." : "שווה לעבור שוב על הסיכום ולנסות שוב."}</p>
        <div class="row" style="justify-content:center">${wrong.length > 0 && onMistakes && html`<button class="btn gold" onClick=${() => onMistakes(wrong)}>תרגול רק הטעויות (${wrong.length})</button>`}${onRestart && html`<button class="btn ghost" onClick=${onRestart}>נסה שוב</button>`}</div></div>
      ${stats.length > 1 && html`<div class="card stack" style="gap:10px"><h3>לפי נושאים</h3>${stats.map((s) => html`<div class="stack" style="gap:4px"><div class="row between small"><span>${s.topic}</span><b style=${{ color: s.pct < 60 ? "var(--bad)" : s.pct < 80 ? "var(--warn)" : "var(--good)" }}>${s.c}/${s.n}</b></div><${Bar} v=${s.pct / 100} /></div>`)}</div>`}
      <h3>סקירת התשובות</h3>${questions.map((qq, k) => html`<${QCard} q=${qq} n=${k + 1} chosen=${ans[k]} shown />`)}
    </div>`;
  }
  return html`<div class="stack">
    <div class="row"><div class="grow"><${Bar} v=${(i + (chosen >= 0 ? 1 : 0)) / questions.length} /></div><span class="small muted ltr">${i + 1}/${questions.length}</span>${left !== null && html`<span class=${"chip ltr " + (left < 60 ? "bad" : "")}>${Math.floor(Math.max(0, left) / 60)}:${String(Math.max(0, left) % 60).padStart(2, "0")}</span>`}</div>
    <${QCard} q=${q} n=${i + 1} chosen=${chosen} shown=${mode === "practice" && shown} onChoose=${choose} />
    <div class="row between"><button class="btn quiet" disabled=${i === 0} onClick=${() => { setShown(mode === "practice" && ans[i - 1] >= 0); setI(i - 1); }}>הקודמת</button>
      ${mode === "exam" && i === questions.length - 1 ? html`<button class="btn primary" onClick=${() => finish()}>הגשת המבחן</button>` : html`<button class="btn primary" disabled=${chosen < 0} onClick=${next}>${i === questions.length - 1 ? "לתוצאות" : "הבאה"}</button>`}</div>
    ${mode === "exam" && html`<div class="row" style="justify-content:center;gap:6px">${questions.map((_, k) => html`<button class="btn sm" style=${{ minHeight: "32px", width: "34px", padding: 0, background: k === i ? "var(--plum)" : ans[k] >= 0 ? "var(--plum-soft)" : "var(--card)", color: k === i ? "var(--card)" : "inherit", border: "1px solid var(--line)" }} onClick=${() => setI(k)} aria-label=${"שאלה " + (k + 1)}>${k + 1}</button>`)}</div>`}
  </div>`;
}
function QCard({ q, n, chosen, shown, onChoose }) {
  return html`<div class="card stack" style="gap:12px">
    <div class="row between" style="align-items:start"><h3 style="font-family:var(--body);font-weight:600;line-height:1.6"><span class="muted">${n}. </span><span dir=${dirOf(q.question)}>${q.question}</span></h3><span class="chip">${q.topic}</span></div>
    <div class="stack" style="gap:8px">${q.options.map((o, k) => { const ok = k === q.correctIndex, me = chosen === k; const cls = shown ? (ok ? " ok" : me ? " no" : "") : me ? " sel" : ""; return html`<button class=${"opt" + cls} disabled=${!onChoose || shown} onClick=${() => onChoose?.(k)}><span class="letter">${LETTERS[k]}</span><span class="grow" dir=${dirOf(o)} style="text-align:start">${o}</span>${shown && ok && html`<${Icon} n="check" />`}</button>`; })}</div>
    ${shown && html`<div class="explain"><b>הסבר: </b>${q.explanation}${q.lessonTitle && html`<span class="muted small" style="display:block">מתוך: ${q.lessonTitle}</span>`}</div>`}
  </div>`;
}
function Ring({ pct }) { const r = 50, C = 2 * Math.PI * r; const col = pct >= 80 ? "var(--good)" : pct >= 60 ? "var(--gold)" : "var(--bad)"; return html`<div style="position:relative;width:130px;height:130px"><svg viewBox="0 0 120 120" style="width:100%;height:100%;transform:rotate(-90deg)"><circle cx="60" cy="60" r=${r} stroke="var(--line)" stroke-width="10" fill="none" /><circle cx="60" cy="60" r=${r} stroke=${col} stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray=${C} stroke-dashoffset=${C * (1 - pct / 100)} /></svg><b style="position:absolute;inset:0;display:grid;place-items:center;font-size:2rem;font-family:var(--display)">${pct}%</b></div>`; }

/* ---------------- Open questions with grading ---------------- */
function OpenPractice({ questions, courseId, lessonId, empty }) {
  const qs = cleanOpen(questions); const [i, setI] = useState(0); const [answer, setAnswer] = useState(""); const [grade, setGrade] = useState(null); const [busy, setBusy] = useState(false); const [showModel, setShowModel] = useState(false);
  if (!qs.length) return html`<${Empty} icon="pen" title="אין עדיין שאלות פתוחות" text=${empty} />`;
  const q = qs[i];
  async function check() {
    if (!answer.trim()) return; setBusy(true);
    try {
      const g = await askJSON(P_.grade(q, answer));
      const res = { score: clamp(Math.round(+g.score || 0), 0, 100), verdict: String(g.verdict || ""), strengths: (g.strengths || []).map(String), missing: (g.missing || []).map(String), feedback: String(g.feedback || "") };
      setGrade(res);
      put("attempts", newId(), { courseId, lessonId: lessonId || null, kind: "open", score: res.score, questions: [{ question: q.question, topic: q.topic || "שאלה פתוחה", options: [], correctIndex: 0 }], answers: [0], createdAt: Date.now() }).catch(() => {});
    } catch (e) { pushToast(e.message, "bad"); } finally { setBusy(false); }
  }
  const nextQ = (d) => { setI((i + d + qs.length) % qs.length); setAnswer(""); setGrade(null); setShowModel(false); };
  return html`<div class="stack">
    <div class="row between"><span class="small muted">שאלה ${i + 1} מתוך ${qs.length}</span><div class="row" style="gap:6px"><button class="btn quiet sm" onClick=${() => nextQ(-1)}>הקודמת</button><button class="btn quiet sm" onClick=${() => nextQ(1)}>הבאה</button></div></div>
    <div class="card stack"><h3 style="font-family:var(--body);font-weight:600;line-height:1.6" dir=${dirOf(q.question)}>${q.question}</h3>
      <textarea id="open-answer" class="textarea" style="min-height:180px" placeholder="כתוב את התשובה שלך כמו במבחן…" value=${answer} onInput=${(e) => setAnswer(e.target.value)} disabled=${busy}></textarea>
      <div class="row"><button class="btn primary" disabled=${busy || !answer.trim()} onClick=${check}>${busy ? html`<${Busy} label="בודק…" />` : "בדיקת התשובה"}</button><button class="btn ghost" onClick=${() => setShowModel(!showModel)}>${showModel ? "הסתר" : "הצג"} תשובה לדוגמה</button></div>
    </div>
    ${grade && html`<div class="card stack"><div class="row"><${Ring} pct=${grade.score} /><div class="grow stack" style="gap:6px"><b>${grade.verdict}</b>${grade.strengths.length > 0 && html`<div><span class="chip good">מה היה טוב</span><ul style="margin:4px 0 0;padding-inline-start:1.2em">${grade.strengths.map((s) => html`<li>${s}</li>`)}</ul></div>`}${grade.missing.length > 0 && html`<div><span class="chip bad">מה חסר</span><ul style="margin:4px 0 0;padding-inline-start:1.2em">${grade.missing.map((s) => html`<li>${s}</li>`)}</ul></div>`}</div></div>${grade.feedback && html`<${Md} text=${grade.feedback} />`}</div>`}
    ${showModel && html`<div class="card stack" style="background:var(--gold-soft);border-color:transparent"><h3>תשובה לדוגמה</h3><${Md} text=${q.modelAnswer} />${q.rubric?.length > 0 && html`<div><b class="small">מחוון:</b><ul style="margin:4px 0 0;padding-inline-start:1.2em">${q.rubric.map((r) => html`<li class="small">${r}</li>`)}</ul></div>`}</div>`}
  </div>`;
}

/* ---------------- Flashcards ---------------- */
function CardsTab({ cards }) {
  const [mode, setMode] = useState(null); const [k, setK] = useState(0);
  const due = cards.filter(isDue);
  if (mode) return html`<div class="stack"><button class="btn quiet sm" style="justify-self:start" onClick=${() => setMode(null)}>חזרה</button><${Deck} key=${k} cards=${mode === "due" ? due : cards} /></div>`;

function Deck({ cards }) {

}

  const nb = c.notebook;
  useEffect(() => {
    if (!nb) { setChapters([]); return; }
    (async () => { const out = []; for (let i = 0; i < (nb.chapterCount || 0); i++) { const s = await col("chapters").doc(`${c.id}_${i}`).get(); if (s.exists) out.push(s.data()); } setChapters(out); })().catch(() => setChapters([]));
  }, [nb?.updatedAt]);
  const missing = ready.filter((l) => !(nb?.lessonIds || []).includes(l.id)).length;

  async function build() {
    setProg({ t: "בונה את מבנה המחברת…", v: 0.05 });
